const TRAITS = [
  { key: 'strong',   name: 'Силач',        desc: '+40% к копанию',            mod: p => p.skills.dig += 0.4 },
  { key: 'builder',  name: 'Мастеровой',   desc: '+40% к строительству',      mod: p => p.skills.build += 0.4 },
  { key: 'green',    name: 'Агроном',      desc: '+50% к фермерству',         mod: p => p.skills.farm += 0.5 },
  { key: 'fast',     name: 'Быстрые ноги', desc: '+30% к скорости',           mod: p => p.speed *= 1.3 },
  { key: 'lungs',    name: 'Ёмкие лёгкие', desc: 'дольше держится без O₂',    mod: p => p.lungs = 2.0 },
  { key: 'glutton',  name: 'Обжора',       desc: 'ест на 40% больше',         mod: p => p.appetite = 1.4 },
  { key: 'nervous',  name: 'Нервный',      desc: 'стресс растёт быстрее',     mod: p => p.stressRate = 1.6 },
  { key: 'calm',     name: 'Хладнокровный',desc: 'стресс растёт медленнее',   mod: p => p.stressRate = 0.55 },
  { key: 'owl',      name: 'Сова',         desc: 'меньше спит',               mod: p => p.sleepNeed = 0.7 },
  { key: 'lazy',     name: 'Лентяй',       desc: '-25% ко всей работе',       mod: p => p.workMul = 0.75 },
];

let UID = 1;

class Pawn {
  constructor(world, x, y, rng) {
    this.id = UID++;
    this.name = randomName(rng);
    this.x = x; this.y = y;
    this.px = x; this.py = y;
    this.path = null; this.plan = []; this.job = null;
    this.speed = 3.4;            // тайлов/с
    this.lungs = 1; this.appetite = 1; this.stressRate = 1; this.sleepNeed = 1; this.workMul = 1;
    this.skills = { dig: 1, build: 1, farm: 1, haul: 1 };
    this.xp = { dig: 0, build: 0, farm: 0, haul: 0 };
    this.oxygen = 100; this.calories = 3000; this.stamina = 100; this.stress = 0; this.health = 100;
    this.bladder = 0; this.hygiene = 100; this.fun = 70;
    this.germs = { slimelung: 0, food: 0 };
    this.sick = null;
    this.suitO2 = 0;      // запас кислорода в скафандре
    this.memories = [];   // временные впечатления (как мысли в RimWorld)
    this.rel = new Map(); // мнения о других колонистах
    this.diet = [];       // что ел в последнее время
    this.passions = {};   // увлечения: ускоряют рост навыка
    this.mood = 100; this.moodFactors = [];
    this.carry = null; this.task = 'idle'; this.facing = 1; this.anim = 0;
    this.disabled = {};
    this.prio = {};        // тип работы -> 0 (выкл) … 5 (срочно), по умолчанию 3
    this.bed = null; this.breaking = false; this.retryAt = 0;
    this.traits = [];
    const pool = [...TRAITS];
    for (let i = 0; i < 2; i++) {
      const t = pool.splice(Math.floor(rng() * pool.length), 1)[0];
      this.traits.push(t); t.mod(this);
    }
    for (const sk of ['dig', 'build', 'farm', 'haul']) {
      const r = rng();
      this.passions[sk] = r > 0.82 ? 2 : r > 0.62 ? 1 : 0;   // 2 — страсть, 1 — интерес
    }
    this.color = `hsl(${Math.floor(rng() * 360)},55%,62%)`;
  }

  get idx() { return this.y * W + this.x; }
  get maxCalories() { return 4000; }

  // ------------------------------------------------------------- потребности
  updateNeeds(world, game, dt) {
    const i = this.idx;
    // дышим на уровне головы, а выдыхаем CO₂ вниз — он тяжелее
    const head = world.inside(this.x, this.y - 1) && !world.gasBlocked(i - W) ? i - W : i;
    const o2 = world.o2[head];
    const submerged = world.water[i] > 450 || world.water[head] > 450;   // с головой
    if (submerged) {
      this.oxygen -= (14 / this.lungs) * dt;          // тонет
      this.health -= 1.5 * dt;
    } else if (this.suitO2 > 0 && o2 <= BREATH_MIN) {
      this.suitO2 = Math.max(0, this.suitO2 - 3 * dt);   // дышим из баллона
      this.oxygen = Math.min(100, this.oxygen + 20 * dt);
    } else if (o2 > BREATH_MIN) {
      world.o2[head] = Math.max(0, o2 - 0.0009 * dt * 60 * 0.2);
      world.co2[i] += 0.0006 * dt * 60 * 0.2;
      this.oxygen = Math.min(100, this.oxygen + 25 * dt);
    } else {
      this.oxygen -= (8 / this.lungs) * dt;
    }

    // дозаправка скафандра у дока
    if (this.suitO2 < 100) {
      for (const st of world.allAt(this.x, this.y).concat(world.allAt(this.x + 1, this.y), world.allAt(this.x - 1, this.y))) {
        if (!st.built || !st.def.suit || !st.powered || (st.store.o2 || 0) <= 0.01) continue;
        const take = Math.min(st.store.o2, 0.02 * dt * 60);
        st.store.o2 -= take;
        this.suitO2 = Math.min(100, this.suitO2 + take * 120);
        break;
      }
    }

    // температура: перегрев и переохлаждение
    const T = world.temp[i];
    if (T > 40) { this.health -= (T - 40) * 0.05 * dt; if (T > 70) this.remember('scalded'); }
    if (T < -5) this.health -= (-5 - T) * 0.05 * dt;
    if (this.health < 100) this.health = Math.min(100, this.health + (this.task === 'sleep' ? 1.2 : 0.35) * dt);
    this.calories -= (this.task === 'sleep' ? 0.9 : 1.8) * this.appetite * dt;
    if (this.task === 'sleep') this.stamina = Math.min(100, this.stamina + 0.75 * dt);
    else this.stamina -= 0.22 / this.sleepNeed * dt;

    this.bladder = Math.min(120, this.bladder + (this.task === 'sleep' ? 0.05 : 0.12) * dt);
    this.hygiene = Math.max(0, this.hygiene - 0.05 * dt);
    this.fun = Math.max(0, this.fun - (this.task === 'sleep' ? 0 : 0.07) * dt);

    // микробы: слизь и грязная вода заражают, гигиена защищает
    const germCell = world.germs[i];
    if (germCell > 1) {
      this.germs.slimelung += germCell * 0.0006 * dt * (submerged ? 3 : 1);
      world.germs[i] = Math.max(0, germCell - 0.02 * dt);
    }
    if (world.pwater[i] > 0.4 && world.water[i] > 50) this.germs.food += 0.05 * dt;
    if (this.hygiene > 70) { this.germs.food *= 1 - 0.04 * dt; this.germs.slimelung *= 1 - 0.02 * dt; }
    if (!this.sick) {
      if (this.germs.slimelung > 1) this.sick = { type: 'slimelung', name: 'Слизистая лёгочка', t: 0 };
      else if (this.germs.food > 1) this.sick = { type: 'food', name: 'Пищевое отравление', t: 0 };
      if (this.sick) game.alert(`${this.name} заболел: ${this.sick.name}`);
    } else {
      this.sick.t += dt;
      if (this.sick.type === 'slimelung') { this.health -= 0.5 * dt; this.stamina -= 0.1 * dt; }
      else { this.calories -= 1.2 * dt; this.bladder += 0.25 * dt; }
      const healRate = this.onMedCot ? 4 : 1;
      this.germs[this.sick.type] -= 0.012 * healRate * dt;
      if (this.germs[this.sick.type] <= 0) {
        this.germs[this.sick.type] = 0;
        game.alert(`${this.name} выздоровел.`, true);
        this.sick = null;
    this.suitO2 = 0;      // запас кислорода в скафандре
    this.memories = [];   // временные впечатления (как мысли в RimWorld)
    this.rel = new Map(); // мнения о других колонистах
    this.diet = [];       // что ел в последнее время
    this.passions = {};   // увлечения: ускоряют рост навыка
      }
    }

    // не дотерпел
    if (this.bladder >= 120) {
      this.bladder = 0;
      world.water[i] += 30; world.pwater[i] = 1; world.germs[i] += 400;
      this.stress = Math.min(100, this.stress + 20);
      this.hygiene = Math.max(0, this.hygiene - 50);
      game.alert(`${this.name} не добежал до уборной...`);
    }

    this.calories = Math.max(-2000, this.calories);
    this.stamina = clamp(this.stamina, 0, 100);
    this.oxygen = clamp(this.oxygen, 0, 100);

    // настроение
    const f = [];
    if (this.calories < 800) f.push(['Голод', -25]);
    else if (this.calories > 3200) f.push(['Сыт', +8]);
    if (this.oxygen < 60) f.push(['Нехватка кислорода', -20]);
    if (this.stamina < 20) f.push(['Хочет спать', -15]);
    if (this.bed) f.push(['Своя койка', +10]);
    if (world.light[i] > 0.4) f.push(['Светло', +5]); else f.push(['Темнота', -6]);
    if (world.co2[i] > 0.9) f.push(['Смрад CO₂', -12]);
    if (world.water[i] > 100) f.push(['Мокрые ноги', -8]);
    if (T > 35) f.push(['Жарко', -12]); else if (T < 5) f.push(['Холодно', -12]);
    if (this.health < 60) f.push(['Плохое самочувствие', -15]);
    if (this.sick) f.push(['Болезнь', -18]);
    if (this.bladder > 80) f.push(['Хочет в уборную', -10]);
    if (this.hygiene < 35) f.push(['Грязный', -8]);
    if (this.fun < 25) f.push(['Скука', -14]); else if (this.fun > 75) f.push(['Отдохнул', +8]);
    if (game.decor > 0) f.push(['Обжитая база', +Math.min(12, game.decor)]);
    const room = game.roomOf(this.x, this.y);
    if (room) f.push([room.name, room.bonus]);
    // воспоминания и отношения
    for (const m of this.memories) m.left -= dt;
    this.memories = this.memories.filter(m => m.left > 0);
    for (const m of this.memories) f.push([m.text, m.value]);
    let social = 0;
    for (const q of game.pawns) {
      if (q === this) continue;
      const op = this.opinion(q);
      if (Math.abs(op) < 20) continue;
      if (Math.abs(q.x - this.x) + Math.abs(q.y - this.y) < 8) social += op > 0 ? 4 : -4;
    }
    if (social) f.push([social > 0 ? 'Рядом друзья' : 'Рядом неприятные люди', Math.max(-12, Math.min(12, social))]);

    this.moodFactors = f;
    const target = clamp(100 + f.reduce((a, b) => a + b[1], 0), 0, 100);
    this.mood += (target - this.mood) * Math.min(1, dt * 0.35);

    const stressPush = (this.mood < 45 ? (45 - this.mood) * 0.05 : -3) * this.stressRate;
    this.stress = clamp(this.stress + stressPush * dt, 0, 100);
    if (this.stress >= 99 && !this.breaking) {
      this.breaking = true; this.dropJob(game);
      const kinds = ['destructive', 'sulk', 'binge'];
      this.breakKind = kinds[Math.floor(Math.random() * kinds.length)];
      const what = { destructive: 'крушит постройки', sulk: 'сидит и плачет', binge: 'заедает стресс' }[this.breakKind];
      game.alert(`${this.name}: нервный срыв — ${what}!`);
      if (this.breakKind === 'destructive') {
        const near = [...world.bdata.values()].filter(st => st.built && !st.def.conduit
          && Math.abs(st.x - this.x) + Math.abs(st.y - this.y) < 6);
        const victim = near[Math.floor(Math.random() * near.length)];
        if (victim) world.removeBuilding(victim.x, victim.y, victim.layer);
      }
      if (this.breakKind === 'binge') this.calories = Math.max(0, this.calories - 600);
    }
    if (this.breaking && this.stress < 55) { this.breaking = false; game.alert(`${this.name} успокоился.`, true); }

    if (this.oxygen <= 0 || this.calories <= -1500 || this.health <= 0) {
      game.kill(this, this.oxygen <= 0 ? (submerged ? 'утонул' : 'задохнулся')
        : this.health <= 0 ? 'погиб от травм' : 'умер от голода');
    }
  }

  dropJob(game) {
    if (this.job) game.board.claimed.delete(this.job.key);
    this.job = null; this.plan = []; this.path = null;
  }

  // -------------------------------------------------------------- поведение
  think(world, game) {
    if (this.plan.length) return;

    if (this.breaking) {
      if (this.breakKind !== 'sulk') this.wander(world);
      this.stress = Math.max(0, this.stress - 1.2 * 0.016);
      this.task = 'idle';
      return;
    }

    // 0. выбраться из воды
    if (world.water[this.idx] > 150) { if (this.planEscapeWater(world)) { this.task = 'breathe'; return; } }
    // 1. воздух
    if (this.oxygen < 45) { if (this.planBreathe(world)) { this.task = 'breathe'; return; } }
    // 2. еда
    if (this.calories < 1500) { if (this.planEat(world, game)) { this.task = 'eat'; return; } }
    // 3. расписание: сон, гигиена, досуг
    const block = game.schedule.at(game.cycleT);
    if (this.stamina < 18 || (block === 'sleep' && this.stamina < 92)) {
      if (this.planSleep(world, game)) { this.task = 'sleep'; return; }
    }
    if (block === 'bath' && (this.hygiene < 90 || this.bladder > 40)) {
      if (this.bladder > 40 && this.planUse(world, game, 'toilet')) { this.task = 'toilet'; return; }
      if (this.planUse(world, game, 'wash')) { this.task = 'wash'; return; }
    }
    if (block === 'rec' && this.fun < 85 && this.planUse(world, game, 'fun')) { this.task = 'fun'; return; }
    // 3.5 личные нужды: уборная, гигиена, лечение, досуг
    if (this.bladder > 75 && this.planUse(world, game, 'toilet')) { this.task = 'toilet'; return; }
    if (this.hygiene < 40 && this.planUse(world, game, 'wash')) { this.task = 'wash'; return; }
    if (this.sick && this.health < 75 && this.planUse(world, game, 'med')) { this.task = 'heal'; return; }
    if (this.fun < 25 && this.planUse(world, game, 'fun')) { this.task = 'fun'; return; }

    // 4. работа
    if (game.time > this.retryAt) {
      const got = game.board.assign(world, this, game);
      if (got) { this.startJob(world, game, got.job, got.path); return; }
      this.retryAt = game.time + 1.2;
    }
    this.task = 'idle';
    this.wander(world);
  }

  wander(world) {
    if (Math.random() < 0.985) return;
    const goals = new Set();
    for (let k = 0; k < 12; k++) {
      const nx = this.x + Math.floor((Math.random() - 0.5) * 14);
      const ny = this.y + Math.floor((Math.random() - 0.5) * 6);
      if (world.inside(nx, ny) && world.standable(nx, ny)) goals.add(ny * W + nx);
    }
    const p = findPath(world, this.x, this.y, goals, 1500);
    if (p) this.plan = [{ go: p }];
  }

  planEscapeWater(world) {
    const goals = new Set();
    for (let y = Math.max(1, this.y - 12); y < this.y + 4; y++)
      for (let x = Math.max(1, this.x - 16); x < this.x + 16; x++) {
        if (!world.inside(x, y)) continue;
        const i = y * W + x;
        if (world.water[i] < 60 && world.standable(x, y) && world.o2[i] > BREATH_MIN) goals.add(i);
      }
    const p = goals.size ? findPath(world, this.x, this.y, goals) : null;
    if (!p) return false;
    this.dropJobSoft();
    this.plan = [{ go: p }];
    return true;
  }

  dropJobSoft() { this.plan = []; }

  planBreathe(world) {
    const goals = new Set();
    let best = Infinity;
    for (let y = Math.max(1, this.y - 20); y < Math.min(world.o2.length / W - 1, this.y + 20); y++) {
      for (let x = Math.max(1, this.x - 30); x < this.x + 30; x++) {
        if (!world.inside(x, y)) continue;
        const i = y * W + x;
        if (world.o2[i] > BREATH_MIN * 2.5 && world.standable(x, y)) {
          const d = Math.abs(x - this.x) + Math.abs(y - this.y);
          if (d < best) { best = d; goals.clear(); goals.add(i); }
        }
      }
    }
    const p = goals.size ? findPath(world, this.x, this.y, goals) : null;
    if (!p) return false;
    this.plan = [{ go: p }, { act: () => this.oxygen > 92, label: 'breathe' }];
    return true;
  }

  planEat(world, game) {
    const found = reachableResource(world, 'meal', this) || reachableResource(world, 'food', this);
    if (!found) return false;
    const src = found.src, res = (src.from ? src.from.store.meal : world.items.get(src.pileIdx)?.meal) ? 'meal' : 'food';
    const steps = [{ go: found.path },
      { act: () => { this.takeFrom(world, src, res, 1000); return true; } }];
    // поесть за столом, если он есть и рядом
    const table = game.findBuilding('table', this);
    if (table) steps.push({ go: null, goals: accessCells(world, table.x, table.y) });
    steps.push({ act: (dt) => {
      if (!this.carry) return true;
      const quality = this.carry.res === 'meal' ? 1.35 : 1;
      const bite = Math.min(this.carry.amt, 900 * dt);
      this.carry.amt -= bite;
      this.calories = Math.min(this.maxCalories, this.calories + bite * quality);
      if (this.carry.res === 'food' && world.germs[this.idx] > 50) this.germs.food += 0.02 * dt;
      if (this.carry.amt <= 0.01 || this.calories >= this.maxCalories - 10) {
        this.diet.push(this.carry.res);
        if (this.diet.length > 4) this.diet.shift();
        if (this.carry.res === 'meal') this.remember('ateGood');
        if (this.diet.length >= 4 && this.diet.every(d => d === this.diet[0])) this.remember('ateSame');
        if (this.carry.amt > 0.01) world.addItem(this.x, this.y, this.carry.res, this.carry.amt);
        this.carry = null; return true;
      }
      return false;
    }, label: 'eat' });
    this.plan = steps;
    return true;
  }

  planSleep(world, game) {
    let bed = game.claimBed(this);
    const goals = bed ? accessCells(world, bed.x, bed.y) : null;
    if (goals) {
      const p = findPath(world, this.x, this.y, goals);
      if (p) {
        this.plan = [{ go: p }, { act: () => { if (this.stamina > 97) { this.remember('slept'); return true; } return false; }, label: 'sleep' }];
        return true;
      }
    }
    if (this.stamina < 6) {
      this.remember('sleptFloor');
      this.plan = [{ act: () => this.stamina > 60, label: 'sleep' }];
      return true;
    }
    return false;
  }

  /** Универсальный поход к бытовому зданию: уборная, умывальник, медкойка, автомат. */
  planUse(world, game, kind) {
    const match = st => kind === 'toilet' ? st.def.toilet
      : kind === 'wash' ? st.def.wash
      : kind === 'med' ? st.def.med
      : st.def.fun;
    let best = null, bd = Infinity;
    for (const [, st] of world.bdata) {
      if (!st.built || !match(st) || st.busy) continue;
      if (kind === 'fun' && st.def.power < 0 && !st.powered) continue;
      const d = Math.abs(st.x - this.x) + Math.abs(st.y - this.y);
      if (d < bd) { bd = d; best = st; }
    }
    if (!best) return false;
    const p = findPath(world, this.x, this.y, accessCells(world, best.x, best.y));
    if (!p) return false;
    best.busy = this;
    const use = (dt) => {
      best.busy = this;
      const i = best.y * W + best.x;
      if (kind === 'toilet') {
        this.bladder = Math.max(0, this.bladder - 60 * dt);
        this.hygiene = Math.max(0, this.hygiene - 8 * dt);
        if (this.bladder <= 0) {
          best.uses = (best.uses || 0) + 1;
          if ((best.store.dirt || 0) > 5) best.store.dirt -= 5;
          world.addItem(best.x, best.y, 'pdirt', 6);
          world.germs[i] += 60;
          best.busy = null; return true;
        }
      } else if (kind === 'wash') {
        const need = best.def.net?.liquid ? (best.store.water || 0) > 0.5 : true;
        if (!need) { best.busy = null; return true; }
        if (best.store.water) best.store.water -= 5 * dt;
        this.hygiene = Math.min(100, this.hygiene + 45 * dt);
        this.germs.food *= 1 - 1.2 * dt;
        this.germs.slimelung *= 1 - 0.5 * dt;
        world.germs[i] += 4 * dt;
        if (this.hygiene >= 99) { best.busy = null; return true; }
      } else if (kind === 'med') {
        this.onMedCot = true;
        this.health = Math.min(100, this.health + 3 * dt);
        this.stamina = Math.min(100, this.stamina + 0.5 * dt);
        if (!this.sick && this.health > 95) { this.onMedCot = false; best.busy = null; return true; }
      } else {
        this.fun = Math.min(100, this.fun + 12 * dt);
        this.stress = Math.max(0, this.stress - 3 * dt);
        if (this.fun >= 85) { best.busy = null; return true; }
      }
      return false;
    };
    this.plan = [{ go: p }, { act: use, label: kind === 'toilet' ? 'toilet' : kind === 'wash' ? 'wash' : kind === 'med' ? 'heal' : 'fun' }];
    return true;
  }

  startJob(world, game, job, path) {
    this.job = job;
    this.task = job.type;
    const steps = [];
    if (job.type === 'supply' || job.type === 'haul') {
      if (job.type === 'haul') {
        const target = reachableStorage(world, job.res, this);
        if (!target) { game.board.postpone(job, game.time + 20); this.dropJob(game); return; }
        steps.push({ go: path });
        steps.push({ act: () => { this.takeFrom(world, { x: job.x, y: job.y, pileIdx: job.y * W + job.x }, job.res, 100); return true; } });
        steps.push({ goals: accessCells(world, target.bin.x, target.bin.y) });
        steps.push({ act: () => { this.deposit(world, target.bin); return true; } });
      } else {
        const found = reachableResource(world, job.res, this);
        if (!found) { game.board.postpone(job, game.time + 20); this.dropJob(game); return; }
        const src = found.src;
        steps.push({ go: found.path });
        steps.push({ act: () => { this.takeFrom(world, src, job.res, job.amount); return true; } });
        steps.push({ goals: accessCells(world, job.x, job.y) });
        steps.push({ act: () => { this.deliverToSite(world, job); return true; } });
      }
    } else if (job.type === 'dig') {
      steps.push({ go: path });
      steps.push({ act: (dt) => {
        if (!world.mat[job.y * W + job.x]) return true;
        const mat = world.mat[job.y * W + job.x];
        const done = world.mine(job.x, job.y, this.workRate('dig') * dt * 4);
        this.gain('dig', dt);
        this.dustAt = (this.dustAt || 0) - dt;
        if (this.dustAt <= 0) {
          this.dustAt = 0.22;
          game.fx.push({ x: job.x, y: job.y, big: done, color: MATS[mat]?.color || '#c8b49a' });
        }
        return done;
      }, label: 'dig' });
    } else if (job.type === 'build') {
      steps.push({ go: path });
      steps.push({ act: (dt) => {
        const st = world.bdata.get(job.k);
        if (!st || st.built) return true;
        st.prog += this.workRate('build') * dt * 3;
        this.gain('build', dt);
        if (st.prog >= st.def.work) { st.built = true; st.prog = st.def.work; return true; }
        return false;
      }, label: 'build' });
    } else if (job.type === 'deconstruct') {
      steps.push({ go: path });
      steps.push({ act: (dt) => {
        const st = world.bdata.get(job.k);
        if (!st) return true;
        st.prog -= this.workRate('build') * dt * 4;
        if (st.prog <= 0) { world.removeBuilding(job.x, job.y); return true; }
        return false;
      }, label: 'deconstruct' });
    } else if (job.type === 'harvest') {
      steps.push({ go: path });
      steps.push({ act: (dt) => {
        const st = world.bdata.get(job.k);
        if (!st || st.growth < 1) return true;
        st.growth = 0; st.planted = true;
        const crop = PLANTS[st.plant] || { yield: 'food', amount: 18 };
        world.addItem(job.x, job.y, crop.yield, crop.amount + this.skills.farm * 3);
        this.gain('farm', 1);
        return true;
      }, label: 'harvest' });
    } else if (job.type === 'hunt') {
      steps.push({ go: path });
      steps.push({ act: (dt) => {
        const c = game.critters.find(k => k.id === job.cid);
        if (!c || c.dead) return true;
        if (Math.abs(c.x - this.x) + Math.abs(c.y - this.y) > 2) return true;   // убежал — новая задача
        c.hp = (c.hp ?? 10) - this.workRate('dig') * dt * 4;
        if (c.hp <= 0) {
          c.dead = true;
          world.addItem(c.x, c.y, 'food', c.def.meat);
          game.alert(`${this.name} добыл ${c.def.name.toLowerCase()}а.`, true);
          return true;
        }
        return false;
      }, label: 'hunt' });
    } else if (job.type === 'cook') {
      steps.push({ go: path });
      steps.push({ act: (dt) => {
        const st = world.bdata.get(job.k);
        if (!st || (st.store.food || 0) < 5) return true;
        st.cookProg = (st.cookProg || 0) + this.workRate('build') * dt * 2;
        if (st.cookProg >= 10) {
          st.cookProg = 0;
          st.store.food -= 5;
          world.addItem(job.x, job.y, 'meal', 5);
          this.gain('farm', 1);
          return true;
        }
        return false;
      }, label: 'cook' });
    } else if (job.type === 'research') {
      steps.push({ go: path });
      steps.push({ act: (dt) => {
        const st = world.bdata.get(job.k);
        if (!st || !st.powered || !game.research.current) return true;
        game.research.progress += this.workRate('build') * dt * 1.4;
        this.gain('build', dt * 0.5);
        return game.research.check();
      }, label: 'research' });
    } else if (job.type === 'operate') {
      steps.push({ go: path });
      steps.push({ act: (dt) => {
        const st = world.bdata.get(job.k);
        if (!st || !st.built) return true;
        st.operating = 0.6;
        this.stamina -= 3 * dt;
        return game.power.deficit <= 0 || this.stamina < 12;
      }, label: 'operate' });
    }
    this.plan = steps;
  }

  prioOf(type) { return this.prio[type] ?? 3; }

  // --- социальное -----------------------------------------------------------
  opinion(other) { return this.rel.get(other.id) || 0; }
  addOpinion(other, d) {
    this.rel.set(other.id, Math.max(-100, Math.min(100, this.opinion(other) + d)));
  }
  relationTo(other) { return relationLabel(this.opinion(other)); }

  remember(key) {
    const t = THOUGHTS[key];
    if (!t) return;
    const old = this.memories.find(m => m.key === key);
    if (old) { old.left = t.dur; return; }
    this.memories.push({ key, text: t.text, value: t.value, left: t.dur });
  }

  workRate(skill) {
    const passion = 1 + (this.passions[skill] || 0) * 0.12;
    return this.skills[skill] * this.workMul * passion * (0.6 + this.mood / 250);
  }
  gain(skill, dt) {
    this.xp[skill] += dt * (1 + (this.passions[skill] || 0) * 0.6);
    const lvl = 1 + Math.sqrt(this.xp[skill]) * 0.22;
    this.skills[skill] = Math.max(this.skills[skill], lvl);
  }

  takeFrom(world, src, res, amount) {
    let got = 0;
    if (src.from && src.from.store) {
      got = Math.min(src.from.store[res] || 0, amount);
      src.from.store[res] -= got;
      if (src.from.store[res] <= 1e-6) delete src.from.store[res];
    } else {
      got = world.takeItem(src.pileIdx ?? (src.y * W + src.x), res, amount);
    }
    if (got > 0) this.carry = { res, amt: got };
    this.gain('haul', 0.3);
  }

  deposit(world, bin) {
    if (!this.carry) return;
    const used = Object.values(bin.store).reduce((a, b) => a + b, 0);
    const room = Math.max(0, bin.def.cap - used);
    const put = Math.min(room, this.carry.amt);
    bin.store[this.carry.res] = (bin.store[this.carry.res] || 0) + put;
    this.carry.amt -= put;
    if (this.carry.amt > 0.01) world.addItem(this.x, this.y, this.carry.res, this.carry.amt);
    this.carry = null;
  }

  deliverToSite(world, job) {
    if (!this.carry) return;
    const st = world.bdata.get(job.k);
    if (!st) { world.addItem(this.x, this.y, this.carry.res, this.carry.amt); this.carry = null; return; }
    if (!st.built) {
      st.delivered = st.delivered || {};
      const need = Math.max(0, (st.def.cost[this.carry.res] || 0) - (st.delivered[this.carry.res] || 0));
      const put = Math.min(need, this.carry.amt);
      st.delivered[this.carry.res] = (st.delivered[this.carry.res] || 0) + put;
      if (this.carry.amt - put > 0.01) world.addItem(this.x, this.y, this.carry.res, this.carry.amt - put);
    } else if (st.def.farm) {
      st.store[this.carry.res] = (st.store[this.carry.res] || 0) + this.carry.amt;
      if (this.carry.res === 'ice') { st.store.water = (st.store.water || 0) + this.carry.amt; delete st.store.ice; }
      if (!st.planted) { st.planted = true; st.growth = 0; }
    } else {
      st.store[this.carry.res] = (st.store[this.carry.res] || 0) + this.carry.amt;
    }
    this.carry = null;
  }

  // ---------------------------------------------------------------- шаг ИИ
  update(world, game, dt) {
    this.updateNeeds(world, game, dt);
    if (this.dead) return;
    this.think(world, game);

    const step = this.plan[0];
    if (!step) { this.settle(world, dt); return; }

    if (step.goals && !step.go) {
      const p = findPath(world, this.x, this.y, step.goals);
      if (!p) {
        game.board.postpone(this.job, game.time + 15);
        this.dropJob(game); this.retryAt = game.time + 1;
        return;
      }
      step.go = p;
    }
    if (step.go) {
      if (this.follow(world, step.go, dt)) { this.plan.shift(); }
      this.task = this.job ? this.job.type : (step.label || this.task);
      return;
    }
    if (step.act) {
      this.task = step.label || this.task;
      if (step.act(dt)) {
        this.plan.shift();
        if (!this.plan.length && this.job) { game.board.claimed.delete(this.job.key); this.job = null; }
      }
    }
    this.settle(world, dt);
  }

  /** Гравитация и сглаживание позиции, когда дупликант не идёт. */
  settle(world, dt) {
    if (!world.standable(this.x, this.y) && !world.solid(this.x, this.y + 1)) {
      this.y++;
      this.fallFrom = this.fallFrom ?? this.y - 1;
    } else if (this.fallFrom !== undefined) {
      const h = this.y - this.fallFrom;
      if (h > 4) { this.health -= (h - 4) * 7; this.remember('fell'); }
      this.fallFrom = undefined;
    }
    this.px += (this.x - this.px) * Math.min(1, dt * 12);
    this.py += (this.y - this.py) * Math.min(1, dt * 12);
  }

  follow(world, path, dt) {
    if (!path.length) return true;
    const n = path[0];
    if (world.solid(n.x, n.y)) { this.plan = []; this.path = null; return true; }
    const dx = n.x - this.px, dy = n.y - this.py;
    const d = Math.hypot(dx, dy);
    const climbing = world.climbable(this.x, this.y) || world.climbable(n.x, n.y);
    const v = this.speed * (climbing && Math.abs(dy) > 0.1 ? 0.65 : 1) * (this.mood < 35 ? 0.8 : 1);
    const stepLen = v * dt;
    if (d <= stepLen + 1e-4) {            // доходим ровно до узла, без «перелёта»
      this.px = n.x; this.py = n.y; this.x = n.x; this.y = n.y;
      path.shift();
      if (Math.abs(dx) > 0.05) this.facing = dx > 0 ? 1 : -1;
      this.anim += dt * 9;
      return path.length === 0;
    }
    this.px += (dx / d) * stepLen;
    this.py += (dy / d) * stepLen;
    if (Math.abs(dx) > 0.05) this.facing = dx > 0 ? 1 : -1;
    this.x = Math.round(this.px); this.y = Math.round(this.py);
    this.anim += dt * 9;
    this.path = path;
    return false;
  }

  statusText() { return JOB_LABEL[this.task] || this.task; }
}

// Дерево исследований: открывает постройки, изучается в лаборатории.
const TECHS = [
  { key: 'power1', name: 'Энергетика',   cost: 120, req: [],          unlock: ['coalgen', 'lamp'],                     desc: 'Угольный генератор и освещение' },
  { key: 'air1',   name: 'Вентиляция',   cost: 180, req: ['power1'],  unlock: ['gpipe', 'gpump', 'gvent', 'skimmer', 'electro'], desc: 'Газовые трубы, насосы, электролизёр' },
  { key: 'plumb1', name: 'Сантехника',   cost: 180, req: ['power1'],  unlock: ['lpipe', 'lpump', 'lvent', 'sieve', 'shower'],    desc: 'Водопровод и очистка воды' },
  { key: 'food1',  name: 'Агрономика',   cost: 150, req: [],          unlock: ['grill', 'ration', 'compost'],          desc: 'Кухня, холодильник, компост' },
  { key: 'med1',   name: 'Медицина',     cost: 240, req: ['food1'],   unlock: ['medcot'],                              desc: 'Медкойка и лечение болезней' },
  { key: 'rec1',   name: 'Досуг',        cost: 220, req: ['power1'],  unlock: ['arcade'],                              desc: 'Развлечения снижают стресс' },
  { key: 'auto1',  name: 'Автоматика',   cost: 260, req: ['power1'],  unlock: ['awire', 'tsensor', 'psensor', 'wsensor', 'switch'], desc: 'Датчики и логические провода' },
  { key: 'ranch1', name: 'Ранчо',        cost: 260, req: ['food1'],   unlock: ['feeder'],                              desc: 'Приручение хатчей' },
];

class Research {
  constructor(game) {
    this.game = game;
    this.done = new Set();
    this.current = null;
    this.progress = 0;
  }

  available() {
    return TECHS.filter(t => !this.done.has(t.key) && t.req.every(r => this.done.has(r)));
  }

  select(key) {
    const t = TECHS.find(x => x.key === key);
    if (!t || this.done.has(key)) return;
    if (this.current?.key !== key) this.progress = 0;
    this.current = t;
  }

  /** true — тема завершена (работа оператора окончена). */
  check() {
    if (!this.current) return true;
    if (this.progress < this.current.cost) return false;
    this.done.add(this.current.key);
    this.game.alert(`Исследовано: ${this.current.name}!`, true);
    for (const p of this.game.pawns) p.remember('newTech');
    this.current = null;
    this.progress = 0;
    return true;
  }

  unlocked(def) { return !def.tech || this.done.has(def.tech); }
}

// Расписание колонии: цикл делится на 12 отрезков со своим режимом.
const BLOCKS = {
  work:  { name: 'Работа',  color: '#ffb43d', icon: '⛏' },
  rec:   { name: 'Досуг',   color: '#c58ae0', icon: '🕹' },
  bath:  { name: 'Гигиена', color: '#7ec8c8', icon: '🚿' },
  sleep: { name: 'Сон',     color: '#5a7fd6', icon: '💤' },
};

class Schedule {
  constructor() {
    this.slots = ['work', 'work', 'work', 'work', 'work', 'work', 'work', 'work',
      'bath', 'rec', 'sleep', 'sleep'];
  }
  at(cycleT) { return this.slots[Math.min(11, Math.floor(cycleT * 12))]; }
  cycle(idx) {
    const keys = Object.keys(BLOCKS);
    this.slots[idx] = keys[(keys.indexOf(this.slots[idx]) + 1) % keys.length];
  }
}

// ===== rooms.js ====================================================
// Комнаты: замкнутые помещения дают бонусы к настроению, как в ONI.

const MAX_ROOM = 120;

const ROOM_TYPES = [
  { key: 'bedroom', name: 'Спальня',  need: st => st.def.sleep,  bonus: 8 },
  { key: 'mess',    name: 'Столовая', need: st => st.def.eat,    bonus: 6 },
  { key: 'latrine', name: 'Санузел',  need: st => st.def.toilet, bonus: 4 },
  { key: 'rec',     name: 'Зона отдыха', need: st => st.def.fun, bonus: 6 },
  { key: 'lab',     name: 'Лаборатория', need: st => st.def.manualWork === 'research', bonus: 3 },
];

/** Найти замкнутые помещения и приписать их постройкам. */
function findRooms(world) {
  const seen = new Uint8Array(W * H);
  const rooms = [];
  for (const [, st] of world.bdata) {
    if (!st.built || st.def.conduit) continue;
    const start = st.y * W + st.x;
    if (seen[start]) continue;
    const tiles = [];
    const stack = [start];
    seen[start] = 1;
    let sealed = true;
    while (stack.length) {
      const c = stack.pop();
      tiles.push(c);
      if (tiles.length > MAX_ROOM) { sealed = false; break; }
      const cx = c % W, cy = (c / W) | 0;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = cx + dx, ny = cy + dy;
        if (nx < 1 || ny < 1 || nx >= W - 1 || ny >= H - 1) { sealed = false; continue; }
        const n = ny * W + nx;
        if (world.gasBlocked(n)) continue;       // стена, плитка или дверь — граница
        if (seen[n]) continue;
        seen[n] = 1; stack.push(n);
      }
    }
    if (!sealed) continue;
    const set = new Set(tiles);
    const inside = [];
    for (const [, s2] of world.bdata) if (s2.built && set.has(s2.y * W + s2.x)) inside.push(s2);
    const type = ROOM_TYPES.find(t => inside.some(t.need));
    if (!type) continue;
    const decor = inside.reduce((a, b) => a + (b.def.decor || 0), 0);
    const room = { type: type.key, name: type.name, bonus: type.bonus + Math.min(8, decor), tiles: set, buildings: inside };
    for (const s2 of inside) s2.room = room;
    rooms.push(room);
  }
  return rooms;
}

function roomAt(rooms, x, y) {
  const i = y * W + x;
  return rooms.find(r => r.tiles.has(i)) || null;
}

// ===== critters.js =================================================
// Живность: хатчи грызут породу и дают уголь, пуфты чистят воздух, паку живут в воде.

const SPECIES = {
  hatch: {
    name: 'Хатч', icon: '🐗', color: '#b0784a', habitat: 'ground',
    eats: ['stone', 'coal', 'copper', 'dirt'], drops: 'coal', dropAmt: 8,
    meat: 30, eatRate: 6, hungerMax: 1200, breedAt: 900, life: 3000,
  },
  puft: {
    name: 'Пуфт', icon: '🫧', color: '#c9a2d8', habitat: 'air',
    gas: 'co2', drops: 'slime', dropAmt: 4,
    meat: 12, eatRate: 0.05, hungerMax: 900, breedAt: 700, life: 2400,
  },
  pacu: {
    name: 'Паку', icon: '🐟', color: '#6fb6c8', habitat: 'water',
    eats: ['algae'], drops: null, dropAmt: 0,
    meat: 25, eatRate: 4, hungerMax: 1000, breedAt: 800, life: 2600,
  },
};

let CID = 1;

class Critter {
  constructor(species, x, y) {
    this.id = CID++;
    this.sp = species;
    this.def = SPECIES[species];
    this.x = x; this.y = y; this.px = x; this.py = y;
    this.hunger = this.def.hungerMax * 0.6;
    this.age = 0; this.digest = 0; this.dir = Math.random() < 0.5 ? -1 : 1;
    this.hunted = false; this.tame = 0; this.dead = false;
  }

  update(world, game, dt) {
    this.age += dt;
    this.hunger -= this.def.eatRate * 0.25 * dt;
    const i = this.y * W + this.x;

    // среда обитания
    if (this.def.habitat === 'water' && world.water[i] < 100) { this.health = -1; }
    if (this.def.habitat === 'ground' && world.water[i] > 500) this.hunger -= 20 * dt;

    // питание
    if (this.def.gas) {
      const g = world[this.def.gas];
      if (g[i] > 0.02) {
        const eat = Math.min(g[i], this.def.eatRate * dt);
        g[i] -= eat; this.hunger = Math.min(this.def.hungerMax, this.hunger + eat * 400);
        world.o2[i] += eat * 0.3;
        this.digest += eat * 100;
      }
    } else {
      const pile = world.items.get(i);
      if (pile) {
        for (const res of this.def.eats) {
          if (!pile[res]) continue;
          const eat = world.takeItem(i, res, this.def.eatRate * dt);
          this.hunger = Math.min(this.def.hungerMax, this.hunger + eat * 20);
          this.digest += eat;
          break;
        }
      } else if (this.sp === 'hatch' && Math.random() < 0.02 * dt * 60) {
        // грызёт стену рядом
        for (const [dx, dy] of [[this.dir, 0], [0, 1]]) {
          const nx = this.x + dx, ny = this.y + dy;
          if (world.matAt(nx, ny) && world.matAt(nx, ny) !== 8 && world.mine(nx, ny, 3)) break;
        }
      }
    }

    // кормушка: прирученные звери едят из неё и дают больше продукта
    if (!this.def.gas) {
      for (const [, st] of world.bdata) {
        if (!st.built || !st.def.feeder) continue;
        if (Math.abs(st.x - this.x) + Math.abs(st.y - this.y) > 4) continue;
        const food = st.store[st.def.uses] || 0;
        if (food <= 0) continue;
        const eat = Math.min(food, this.def.eatRate * dt);
        st.store[st.def.uses] -= eat;
        this.hunger = Math.min(this.def.hungerMax, this.hunger + eat * 25);
        this.digest += eat * 1.5;
        this.tame = Math.min(1, this.tame + 0.02 * dt);
        break;
      }
    }

    // продукт жизнедеятельности
    if (this.digest > 12) {
      this.digest = 0;
      if (this.def.drops) world.addItem(this.x, this.y, this.def.drops, this.def.dropAmt * (1 + this.tame));
    }

    // размножение
    if (this.hunger > this.def.breedAt && this.age > 200 && Math.random() < 0.004 * dt) {
      if (game.critters.length < 40) {
        game.critters.push(new Critter(this.sp, this.x, this.y));
        this.hunger *= 0.6;
      }
    }

    // смерть
    if (this.hunger <= 0 || this.age > this.def.life || this.health === -1) {
      this.dead = true;
      world.addItem(this.x, this.y, 'food', this.def.meat * 0.5);
      return;
    }

    this.move(world, dt);
  }

  move(world, dt) {
    const speed = this.def.habitat === 'air' ? 1.2 : this.def.habitat === 'water' ? 1.6 : 1.8;
    if (Math.random() < 0.6 * dt) this.dir = -this.dir;

    if (this.def.habitat === 'ground') {
      const nx = this.x + this.dir;
      if (!world.solid(nx, this.y) && world.standable(nx, this.y)) this.x = nx;
      else if (!world.solid(nx, this.y - 1) && world.standable(nx, this.y - 1)) { this.x = nx; this.y--; }
      else this.dir = -this.dir;
      while (!world.standable(this.x, this.y) && !world.solid(this.x, this.y + 1) && this.y < H - 2) this.y++;
    } else if (this.def.habitat === 'air') {
      const nx = this.x + this.dir, ny = this.y + (Math.random() < 0.5 ? -1 : 1);
      if (!world.solid(nx, this.y)) this.x = nx;
      if (!world.solid(this.x, ny) && ny > 1 && ny < H - 1) this.y = ny;
    } else {
      const nx = this.x + this.dir, ny = this.y + (Math.random() < 0.5 ? -1 : 1);
      if (world.water[this.y * W + nx] > 200 && !world.solid(nx, this.y)) this.x = nx;
      if (world.water[ny * W + this.x] > 200 && !world.solid(this.x, ny)) this.y = ny;
    }
    this.px += (this.x - this.px) * Math.min(1, dt * 6);
    this.py += (this.y - this.py) * Math.min(1, dt * 6);
  }
}

/** Заселение мира при генерации. */
function populate(world, rng) {
  const out = [];
  const tryPlace = (sp, cond) => {
    for (let t = 0; t < 600; t++) {
      const x = 2 + Math.floor(rng() * (W - 4));
      const y = Math.floor(H * 0.25 + rng() * H * 0.7);
      const i = y * W + x;
      if (world.mat[i]) continue;
      if (!cond(world, x, y, i)) continue;
      out.push(new Critter(sp, x, y));
      return true;
    }
    return false;
  };
  for (let n = 0; n < 8; n++) tryPlace('hatch', (w, x, y) => w.standable(x, y) && w.water[y * W + x] < 50);
  for (let n = 0; n < 5; n++) tryPlace('puft', (w, x, y, i) => w.co2[i] > 0.05 && w.water[i] < 20);
  for (let n = 0; n < 6; n++) tryPlace('pacu', (w, x, y, i) => w.water[i] > 500);
  return out;
}

// ===== game.js =====================================================
// Игровой цикл: время, энергия, работа зданий, колонисты, события.













const CYCLE = 600;      // секунд на цикл
const GROW_TIME = 150;         // секунд до урожая

class Game {
  constructor(seed) {
    this.world = new World(seed);
    this.rng = makeRNG((seed || 7) * 2654435761 % 4294967295);
    this.board = new JobBoard();
    this.pawns = [];
    this.time = 0; this.cycle = 1; this.cycleT = 0;
    this.speed = 1; this.selected = null; this.hover = null; this.drag = null;
    this.alerts = []; this.decor = 0;
    this.fx = [];        // визуальные события для рендера (пыль, брызги)
    this.power = { gen: 0, demand: 0, deficit: 0, stored: 0, cap: 0 };
    this.nets = new Networks();
    this.research = new Research(this);
    this.schedule = new Schedule();
    this.rooms = []; this.roomsAt = 0;
    this.world.netDirty = true;
    this.rebuildAt = 0; this.gameOver = false; this.warnAt = 20;

    this.critters = populate(this.world, this.rng);
    const s = this.world.start;
    for (let i = 0; i < 3; i++) this.spawnPawn(s.x - 1 + i, s.y);
    // стартовые припасы прямо на полу базы
    this.world.addItem(s.x - 3, s.y, 'stone', 120);
    this.world.addItem(s.x + 3, s.y, 'copper', 80);
    this.world.addItem(s.x - 4, s.y, 'dirt', 60);
    this.world.addItem(s.x + 4, s.y, 'algae', 80);
    this.world.addItem(s.x, s.y, 'food', 20000);
    this.alert('Колония высажена. Копайте, стройте, дышите.', true);
  }

  spawnPawn(x, y) {
    const w = this.world;
    let ty = y;
    while (ty < H - 2 && !w.standable(x, ty)) ty++;
    const p = new Pawn(w, x, ty, this.rng);
    this.pawns.push(p);
    return p;
  }

  alert(text, info = false) {
    this.alerts.push({ text, info, t: this.time });
    if (this.alerts.length > 4) this.alerts.shift();
  }

  kill(pawn, cause) {
    if (pawn.dead) return;
    pawn.dead = true;
    pawn.dropJob(this);
    this.pawns = this.pawns.filter(p => p !== pawn);
    if (pawn.bed) pawn.bed.owner = null;
    this.alert(`${pawn.name} ${cause}.`);
    for (const p of this.pawns) if (p.opinion(pawn) > 20) p.remember('friendDied');
    if (!this.pawns.length) { this.gameOver = true; this.speed = 0; this.alert('Колония погибла. F5 — новая попытка.'); }
  }

  findBuilding(key, near) {
    let best = null, bd = Infinity;
    for (const [, st] of this.world.bdata) {
      if (!st.built || st.def.key !== key) continue;
      const d = near ? Math.abs(st.x - near.x) + Math.abs(st.y - near.y) : 0;
      if (d < bd) { bd = d; best = st; }
    }
    return best;
  }

  claimBed(pawn) {
    if (pawn.bed && pawn.bed.built && pawn.bed.owner === pawn) return pawn.bed;
    for (const [, st] of this.world.bdata) {
      if (!st.built || !st.def.sleep || (st.owner && st.owner !== pawn && !st.owner.dead)) continue;
      st.owner = pawn; pawn.bed = st; return st;
    }
    return null;
  }

  stock(res) { return countResource(this.world, res); }

  // ---------------------------------------------------------------- энергия
  // -------------------------------------------------------------- устройства
  updateBuildings(dt) {
    if (this.world.netDirty) this.nets.rebuild(this.world);
    updateAutomation(this.world, this.nets, dt);
    const burnedBefore = this.power.burned || 0;
    updatePower(this.world, this.nets, dt, this.power);
    if ((this.power.burned || 0) > burnedBefore) this.alert('Провод перегорел от перегрузки!');
    updateMachines(this.world, this.nets, this, dt);

    this.decor = 0;
    for (const [, st] of this.world.bdata) {
      if (!st.built) continue;
      const i = this.world.idx(st.x, st.y);
      if (st.def.decor) this.decor += st.def.decor * 0.4;
      // перегрев: машина в жаре ломается и требует ремонта
      if (st.def.power && this.world.temp[i] > 75) {
        st.overheat = (st.overheat || 0) + dt;
        if (st.overheat > 20) {
          st.overheat = 0; st.built = false; st.prog = st.def.work * 0.4;
          this.alert(`${st.def.name} вышел из строя от перегрева.`);
        }
      } else st.overheat = 0;
      if (st.def.farm && st.planted && st.growth < 1) {
        if (!st.plant) st.plant = chooseCrop(this.world, i);
        const c = checkPlant(this.world, st, i);
        st.wilt = c.ok ? null : c.reason;
        if (c.ok) {
          st.store[c.res] = Math.max(0, st.store[c.res] - c.rate * dt);
          if (c.plant.water > 0) st.store.water = Math.max(0, (st.store.water || 0) - c.plant.water * dt * 0.1);
          const air = this.world.o2[i] > 0.05 ? 1 : 0.4;
          st.growth = Math.min(1, st.growth + dt / c.plant.time * air);
        }
      }
    }
    this.decor = Math.min(20, this.decor);
  }

  // ------------------------------------------------------------------- тик
  update(realDt) {
    if (this.gameOver) return;
    const steps = this.speed;
    if (!steps) return;
    const dt = Math.min(0.05, realDt) * (steps >= 3 ? 1 : 1);
    const iters = steps >= 3 ? 3 : steps;
    for (let k = 0; k < iters; k++) this.tick(dt);
  }

  tick(dt) {
    this.time += dt;
    const c = Math.floor(this.time / CYCLE) + 1;
    if (c !== this.cycle) {
      this.cycle = c;
      this.onNewCycle();
    }
    this.cycleT = (this.time % CYCLE) / CYCLE;

    stepFluids(this.world, dt);
    this.updateVents(dt);
    if (Math.floor(this.time * 2) % 4 === 0) stepLight(this.world);

    this.updateBuildings(dt);

    if (this.time > this.roomsAt) {
      for (const [, st] of this.world.bdata) st.room = null;
      this.rooms = findRooms(this.world);
      this.roomsAt = this.time + 5;
      this.spoilFood(5);
    }
    if (this.time > this.rebuildAt) { this.board.rebuild(this.world, this); this.rebuildAt = this.time + 0.7; }
    for (const p of [...this.pawns]) p.update(this.world, this, dt);
    stepSocial(this, dt);
    this.checkWarnings();
    for (const c of this.critters) c.update(this.world, this, dt);
    if (this.critters.some(c => c.dead)) this.critters = this.critters.filter(c => !c.dead);
  }

  /** Гейзеры: периодически выбрасывают пар, воду, CO₂ или водород. */
  updateVents(dt) {
    const w = this.world;
    for (const v of w.vents) {
      v.t += dt;
      if (!v.active && v.t > v.period) { v.active = true; v.t = 0; }
      if (v.active && v.t > v.period * 0.35) { v.active = false; v.t = 0; }
      if (!v.active) continue;
      const i = w.idx(v.x, v.y);
      if (w.mat[i]) continue;
      const r = v.rate * dt;
      if (v.type === 'steam') { w.steam[i] += r * 0.15; w.temp[i] = Math.min(400, w.temp[i] + r * 25); }
      else if (v.type === 'water') { w.water[i] += r * 9; w.temp[i] += (60 - w.temp[i]) * Math.min(1, r * 0.2); }
      else if (v.type === 'co2') { w.co2[i] += r * 0.12; w.temp[i] += r * 4; }
      else { w.h2[i] += r * 0.06; w.temp[i] += r * 12; }
    }
  }

  /** Еда на полу портится; в работающем холодильнике — нет. */
  spoilFood(dt) {
    const w = this.world;
    for (const [i, pile] of [...w.items]) {
      for (const res of ['food', 'meal']) {
        if (!pile[res]) continue;
        const loss = pile[res] * 0.00006 * dt;   // ~3.5% за цикл на полу
        pile[res] -= loss;
        w.germs[i] += loss * 2;
        if (loss > 0.5) w.addItem(i % W, (i / W) | 0, 'pdirt', loss * 0.2);
        if (pile[res] <= 0.01) delete pile[res];
      }
      if (!Object.keys(pile).length) w.items.delete(i);
    }
    for (const [, st] of w.bdata) {
      if (!st.built || st.def.store !== 'food') continue;
      if (st.chilled) continue;                       // холодильник под током
      for (const res of ['food', 'meal']) {
        if (!st.store[res]) continue;
        st.store[res] *= 1 - 0.00002 * dt;       // в тёплом шкафу портится медленно
        if (st.store[res] < 0.01) delete st.store[res];
      }
    }
  }

  roomOf(x, y) { return roomAt(this.rooms, x, y); }

  /** Случайные события: как у рассказчика в RimWorld, но по-астероидному. */
  rollEvent() {
    const r = this.rng();
    const w = this.world;
    if (r < 0.18) {
      // извержение: один из гейзеров просыпается надолго
      const v = w.vents[Math.floor(this.rng() * w.vents.length)];
      if (v) { v.active = true; v.t = 0; v.rate *= 1.8; this.alert(`Извержение ${v.type}-жерла на ${v.x},${v.y}!`); }
    } else if (r < 0.34) {
      // вспышка болезни: споры в воздухе базы
      const s = w.start, i = w.idx(s.x, s.y);
      w.germs[i] += 800;
      this.alert('Вспышка спор в базе — проветривайте и мойтесь!');
    } else if (r < 0.5) {
      // метеоритный дождь по поверхности
      for (let n = 0; n < 12; n++) {
        const x = 2 + Math.floor(this.rng() * (W - 4));
        for (let y = 1; y < H - 2; y++) {
          const i = w.idx(x, y);
          if (!w.mat[i]) continue;
          w.mat[i] = 0; w.addItem(x, y, 'copper', 12); w.temp[i] += 120;
          w.markDirty(x, y);
          this.fx.push({ x, y, big: true, color: '#ffb46a' });
          break;
        }
      }
      this.alert('Метеоритный дождь! На поверхности появились обломки.');
    } else if (r < 0.62 && this.pawns.length < 12) {
      const s = this.world.start;
      const p = this.spawnPawn(s.x, s.y);
      this.alert(`К шлюзу прибился скиталец: ${p.name}.`, true);
    }
  }

  /** Предупреждения: кислород, энергия, еда, болезни. */
  checkWarnings() {
    if (this.time < this.warnAt) return;
    this.warnAt = this.time + 30;
    const gasping = this.pawns.filter(p => p.oxygen < 45).length;
    if (gasping) this.alert(`Задыхаются: ${gasping}. Нужен кислород!`);
    if (this.power.deficit > 0) this.alert(`Не хватает ${Math.round(this.power.deficit)} Вт.`);
    if (this.stock('food') + this.stock('meal') < 1200 * this.pawns.length)
      this.alert('Еда на исходе — стройте грядки и кухню.');
    const sick = this.pawns.filter(p => p.sick).length;
    if (sick) this.alert(`Больных: ${sick}. Нужны медкойки и гигиена.`);
  }

  onNewCycle() {
    this.alert(`Начался цикл ${this.cycle}.`, true);
    if (this.cycle > 2) this.rollEvent();
    // «печатный под»: новобранец раз в 3 цикла, если есть еда
    if (this.cycle % 3 === 0 && this.pawns.length < 12 && this.stock('food') > 1500) {
      const s = this.world.start;
      const p = this.spawnPawn(s.x, s.y);
      this.alert(`Прибыл новый дупликант: ${p.name}!`, true);
    }
  }

  // -------------------------------------------------------------- приказы
  orderDig(x, y) {
    const w = this.world, i = w.idx(x, y);
    if (!w.inside(x, y) || !w.mat[i] || w.mat[i] === 8) return;
    w.dig[i] = 1;
  }
  cancel(x, y) {
    const w = this.world, i = w.idx(x, y);
    w.dig[i] = 0;
    for (const st of w.allAt(x, y)) {
      if (!st.built) {
        for (const [res, amt] of Object.entries(st.delivered || {})) w.addItem(x, y, res, amt);
        w.removeBuilding(x, y, st.layer);
      } else st.remove = false;
    }
  }
  /** Пометить живность на отлов. */
  orderHunt(x, y) {
    for (const c of this.critters) if (c.x === x && c.y === y) c.hunted = true;
  }

  orderDeconstruct(x, y) {
    for (const st of this.world.allAt(x, y)) if (st.built) st.remove = true;
  }
  place(x, y, key) {
    const def = B_BY_KEY[key];
    if (!def || !this.world.canPlace(x, y, def)) return false;
    this.world.place(x, y, def);
    return true;
  }
}

// ===== textures.js =================================================
// Процедурные текстуры пород: шум, вкрапления, жилы и слоистость.
// Готовятся один раз при старте в офскрин-канвасы, дальше рисуются как спрайты.


const RES = TILE * 3;          // текстуры втрое крупнее тайла — деталь видна и при зуме
const VARIANTS = 8;        // 4 рисунка × 2 отражения — швы между тайлами не читаются

function mix(a, b, t) {
  const ax = parseInt(a.slice(1), 16), bx = parseInt(b.slice(1), 16);
  const r = ((ax >> 16) & 255) * (1 - t) + ((bx >> 16) & 255) * t;
  const g = ((ax >> 8) & 255) * (1 - t) + ((bx >> 8) & 255) * t;
  const bl = (ax & 255) * (1 - t) + (bx & 255) * t;
  return [r | 0, g | 0, bl | 0];
}

function shadeRGB([r, g, b], k) {
  return `rgb(${Math.min(255, r * k) | 0},${Math.min(255, g * k) | 0},${Math.min(255, b * k) | 0})`;
}

/** Усилить насыщенность, сохранив светлоту: породы перестают быть серой кашей. */
function saturate([r, g, b], k) {
  const l = 0.299 * r + 0.587 * g + 0.114 * b;
  return [
    Math.max(0, Math.min(255, l + (r - l) * k)),
    Math.max(0, Math.min(255, l + (g - l) * k)),
    Math.max(0, Math.min(255, l + (b - l) * k)),
  ];
}

function canvas(size = RES) {
  const c = typeof OffscreenCanvas !== 'undefined' ? new OffscreenCanvas(size, size)
    : Object.assign(document.createElement('canvas'), { width: size, height: size });
  return c;
}

/** Зернистость: мягкие пятна разного размера поверх базового цвета. */
function grain(ctx, rng, base, amount, size) {
  for (let i = 0; i < amount; i++) {
    const x = rng() * RES, y = rng() * RES, r = size * (0.4 + rng());
    const k = 0.6 + rng() * 0.75;
    ctx.fillStyle = shadeRGB(base, k);
    ctx.globalAlpha = 0.35 + rng() * 0.45;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/** Осадочные слои (песчаник): горизонтальные полосы разного тона. */
function strata(ctx, rng, base) {
  let y = 0;
  while (y < RES) {
    const h = 2 + rng() * 5;
    ctx.fillStyle = shadeRGB(base, 0.78 + rng() * 0.44);
    ctx.globalAlpha = 0.6;
    ctx.fillRect(0, y, RES, h);
    y += h;
  }
  ctx.globalAlpha = 1;
}

/** Рудные прожилки: ломаные линии яркого минерала. */
function veins(ctx, rng, color, count, width) {
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  for (let i = 0; i < count; i++) {
    ctx.lineWidth = width * (0.6 + rng());
    ctx.globalAlpha = 0.5 + rng() * 0.45;
    let x = rng() * RES, y = rng() * RES;
    ctx.beginPath(); ctx.moveTo(x, y);
    for (let s = 0; s < 3; s++) {
      x += (rng() - 0.5) * RES * 0.7;
      y += (rng() - 0.5) * RES * 0.7;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/** Кристаллические грани (лёд, уголь): светлые и тёмные многоугольники. */
function facets(ctx, rng, base, count, light) {
  for (let i = 0; i < count; i++) {
    const cx = rng() * RES, cy = rng() * RES, r = 3 + rng() * 7;
    ctx.beginPath();
    const n = 3 + Math.floor(rng() * 3);
    for (let k = 0; k < n; k++) {
      const a = (k / n) * Math.PI * 2 + rng();
      ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fillStyle = shadeRGB(base, light ? 1.25 + rng() * 0.25 : 0.7 + rng() * 0.2);
    ctx.globalAlpha = 0.35 + rng() * 0.3;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/** Одна плитка породы. */
function makeTile(mat, seed) {
  const c = canvas();
  const ctx = c.getContext('2d');
  const rng = makeRNG(seed);
  const base = saturate(mix(mat.color, mat.color2, 0.4), 1.35);

  // ровная заливка без градиента: иначе каждый тайл получает свою «полоску» и массив породы полосатит
  ctx.fillStyle = shadeRGB(base, 1);
  ctx.fillRect(0, 0, RES, RES);

  switch (mat.id) {
    case 1:                                     // грунт: комковатый, с камешками
      grain(ctx, rng, base, 190, 2.6);
      veins(ctx, rng, 'rgba(60,40,24,.5)', 3, 1.2);
      break;
    case 2:                                     // песчаник: слоистый
      strata(ctx, rng, base);
      grain(ctx, rng, base, 90, 1.8);
      break;
    case 3:                                     // гранит: крапчатый
      grain(ctx, rng, base, 260, 1.9);
      facets(ctx, rng, base, 12, true);
      break;
    case 4:                                     // уголь: матовый с блестящими сколами
      grain(ctx, rng, base, 150, 2.4);
      facets(ctx, rng, base, 20, true);
      break;
    case 5:                                     // медная руда: породa с рыжими жилами
      grain(ctx, rng, base, 150, 2.2);
      veins(ctx, rng, 'rgba(226,140,60,.85)', 5, 1.8);
      veins(ctx, rng, 'rgba(120,200,160,.4)', 2, 1.1);
      break;
    case 6:                                     // лёд: прозрачные грани и трещины
      facets(ctx, rng, base, 24, true);
      veins(ctx, rng, 'rgba(240,252,255,.7)', 4, 1);
      break;
    case 7:                                     // водоросли: мшистые пятна
      grain(ctx, rng, base, 220, 2.8);
      facets(ctx, rng, base, 16, false);
      break;
    case 8:                                     // абиссалит: плотный, с прожилками
      grain(ctx, rng, base, 130, 2.2);
      veins(ctx, rng, 'rgba(150,130,190,.5)', 4, 1.3);
      break;
    case 9:                                     // слизь: блестящие пузыри
      grain(ctx, rng, base, 170, 3.2);
      facets(ctx, rng, base, 12, true);
      break;
    default:
      grain(ctx, rng, base, 170, 2.4);
  }

  // мелкий общий шум — убирает «пластиковость»
  const img = ctx.getImageData(0, 0, RES, RES);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rng() - 0.5) * 34;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

/** Спрайт кромки: полоска с градиентом прозрачности. */
function edgeSprite(side, color) {
  const thick = Math.round(TILE / 4);
  const horiz = side === 'top' || side === 'bottom';
  const c = canvas(TILE);
  const ctx = c.getContext('2d');
  const g = horiz
    ? ctx.createLinearGradient(0, side === 'top' ? 0 : TILE, 0, side === 'top' ? thick : TILE - thick)
    : ctx.createLinearGradient(side === 'left' ? 0 : TILE, 0, side === 'left' ? thick : TILE - thick, 0);
  g.addColorStop(0, color);
  g.addColorStop(1, color.replace(/[\d.]+\)$/, '0)'));
  ctx.fillStyle = g;
  if (side === 'top') ctx.fillRect(0, 0, TILE, thick);
  else if (side === 'bottom') ctx.fillRect(0, TILE - thick, TILE, thick);
  else if (side === 'left') ctx.fillRect(0, 0, thick, TILE);
  else ctx.fillRect(TILE - thick, 0, thick, TILE);
  return c;
}

class TextureSet {
  constructor() {
    this.tiles = [];        // [matId][variant]
    this.backs = [];        // затемнённые версии для задней стены
    this.edges = {
      top: edgeSprite('top', 'rgba(255,248,230,0.34)'),
      bottom: edgeSprite('bottom', 'rgba(0,0,0,0.45)'),
      left: edgeSprite('left', 'rgba(255,245,220,0.16)'),
      right: edgeSprite('right', 'rgba(0,0,0,0.26)'),
    };
    for (const mat of MATS) {
      if (!mat) { this.tiles.push(null); this.backs.push(null); continue; }
      const vars = [], backs = [];
      for (let v = 0; v < VARIANTS / 2; v++) {
        const t = makeTile(mat, mat.id * 7919 + v * 104729 + 13);
        const mirrored = this.mirror(t);
        vars.push(t, mirrored);
        backs.push(this.darken(t, 0.52), this.darken(mirrored, 0.52));
      }
      this.tiles.push(vars);
      this.backs.push(backs);
    }
  }

  /** Зеркальная копия — тот же рисунок, но не повторяется впритык. */
  mirror(src) {
    const c = canvas();
    const ctx = c.getContext('2d');
    ctx.translate(RES, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(src, 0, 0);
    return c;
  }

  /** Тёмная копия текстуры с холодным оттенком — это задняя стена пещеры. */
  darken(src, k) {
    const c = canvas();
    const ctx = c.getContext('2d');
    ctx.drawImage(src, 0, 0);
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = `rgba(8,18,26,${1 - k})`;
    ctx.fillRect(0, 0, RES, RES);
    ctx.globalCompositeOperation = 'source-over';
    return c;
  }

  tile(matId, variant) {
    const v = this.tiles[matId];
    return v ? v[variant % VARIANTS] : null;
  }
  back(matId, variant) {
    const v = this.backs[matId];
    return v ? v[variant % VARIANTS] : null;
  }
}

// ===== render.js ===================================================
// Отрисовка: процедурные текстуры пород, мягкий свет, объёмная вода, частицы.





const hash = (x, y) => {
  let h = (x * 374761393 + y * 668265263) ^ 0x5bf03635;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967296;
};

// цвета ресурсов для кусков на полу
const RES_COLOR = {
  dirt: ['#7a5334', '#4d3220'], stone: ['#9aa0a8', '#5f666e'], coal: ['#3c3c42', '#1d1d21'],
  copper: ['#c87a3c', '#8a4f22'], ice: ['#bfe6f5', '#7fc0d6'], algae: ['#6fa554', '#436b38'],
  slime: ['#86a955', '#55703a'], pdirt: ['#6c6c3c', '#414127'],
  food: ['#cfa14e', '#8c6a28'], meal: ['#e0b45c', '#9c7128'],
};

function makeBuffer(w, h) {
  const c = typeof OffscreenCanvas !== 'undefined' ? new OffscreenCanvas(w, h)
    : Object.assign(document.createElement('canvas'), { width: w, height: h });
  return c;
}

class Renderer {
  constructor(canvas, world) {
    this.c = canvas;
    this.ctx = canvas.getContext('2d');
    this.world = world;
    this.cam = { x: world.start.x * TILE, y: world.start.y * TILE, z: 1.6 };
    this.overlay = 'none';
    this.tex = new TextureSet();
    this.shade = this.makeShadeMap();     // крупные пятна освещённости породы
    this.particles = [];
    this.chunks = new Map();          // кеш кусков ландшафта: рисуем только изменившиеся
    this.chunkScale = 2;
    this.last = performance.now();
    this.t = 0;

    // буферы «на тайл» — их растягивание даёт мягкие градиенты газа и света
    this.gasBuf = makeBuffer(W, H);
    this.gasCtx = this.gasBuf.getContext('2d');
    this.lightBuf = makeBuffer(W, H);
    this.lightCtx = this.lightBuf.getContext('2d');

    this.resize();
    window.addEventListener('resize', () => this.resize());
  }

  /** Низкочастотная карта оттенков: породa не выглядит одинаковой на всю пещеру. */
  makeShadeMap() {
    const n = makeNoise2D(makeRNG(0x51ade));
    const map = new Float32Array(W * H);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) map[y * W + x] = (fbm(n, x * 0.09, y * 0.09, 3) - 0.5) * 2;
    }
    return map;
  }

  resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    this.c.width = Math.floor(this.c.clientWidth * dpr);
    this.c.height = Math.floor(this.c.clientHeight * dpr);
    this.dpr = dpr;
  }

  screenToTile(sx, sy) {
    const z = this.cam.z * this.dpr;
    const wx = (sx * this.dpr - this.c.width / 2) / z + this.cam.x;
    const wy = (sy * this.dpr - this.c.height / 2) / z + this.cam.y;
    return { x: Math.floor(wx / TILE), y: Math.floor(wy / TILE) };
  }

  // ------------------------------------------------------------------ кадр
  draw(game) {
    const now = performance.now();
    const dt = Math.min(0.1, (now - this.last) / 1000);
    this.last = now;
    this.t += dt;

    const { ctx } = this;
    const z = this.cam.z * this.dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#05090d';
    ctx.fillRect(0, 0, this.c.width, this.c.height);
    ctx.save();
    ctx.translate(this.c.width / 2, this.c.height / 2);
    ctx.scale(z, z);
    ctx.translate(-this.cam.x, -this.cam.y);

    const halfW = this.c.width / 2 / z, halfH = this.c.height / 2 / z;
    const x0 = Math.max(0, Math.floor((this.cam.x - halfW) / TILE) - 1);
    const x1 = Math.min(W - 1, Math.ceil((this.cam.x + halfW) / TILE) + 1);
    const y0 = Math.max(0, Math.floor((this.cam.y - halfH) / TILE) - 1);
    const y1 = Math.min(H - 1, Math.ceil((this.cam.y + halfH) / TILE) + 1);
    const view = { x0, x1, y0, y1 };

    this.drawSpace(ctx, view, game);
    this.drawTerrain(ctx, view);
    this.drawLiquid(ctx, view);
    if (this.overlay !== 'gas') this.drawGasClouds(ctx, view);
    this.drawConduits(ctx, view);
    this.drawBuildings(ctx, view);
    this.drawItems(ctx, view);
    this.drawOrders(ctx, view);
    this.drawCritters(ctx, game);
    this.drawPawns(ctx, game);
    this.updateParticles(ctx, game, dt, view);
    if (this.overlay === 'none') this.drawLighting(ctx, view, game);
    if (this.overlay !== 'none') this.drawOverlay(ctx, view, game);
    this.drawCursor(ctx, game);
    ctx.restore();
  }

  // ------------------------------------------------------- космос над поверхностью
  drawSpace(ctx, { x0, x1, y0, y1 }, game) {
    const w = this.world;
    const night = game.cycleT > 0.75;
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const i = y * W + x;
        const px = x * TILE, py = y * TILE;
        const bm = w.back[i];
        if (!bm) {
          const k = Math.min(1, y / 18);
          const c = night ? [9, 13, 34] : [18, 46, 76];
          ctx.fillStyle = `rgb(${(c[0] * (1 - k) + 5 * k) | 0},${(c[1] * (1 - k) + 12 * k) | 0},${(c[2] * (1 - k) + 20 * k) | 0})`;
          ctx.fillRect(px, py, TILE, TILE);
          const h = hash(x, y);
          if (h > 0.93 && y < 12) {
            const tw = 0.55 + 0.45 * Math.sin(this.t * 1.7 + h * 40);
            ctx.fillStyle = `rgba(255,255,255,${(0.2 + h * 0.5) * tw})`;
            ctx.fillRect(px + h * 12, py + (h * 91 % 12), 1.5, 1.5);
          }
        }
      }
    }
  }

  /** Ландшафт кешируется кусками 16×16 тайлов: за кадр — десяток блитов вместо тысяч. */
  drawTerrain(ctx, { x0, x1, y0, y1 }) {
    const w = this.world;
    for (const key of w.dirtyChunks) {
      const ch = this.chunks.get(key);
      if (ch) ch.dirty = true;
    }
    w.dirtyChunks.clear();

    const used = new Set();
    for (let cy = y0 >> 4; cy <= y1 >> 4; cy++) {
      for (let cx = x0 >> 4; cx <= x1 >> 4; cx++) {
        if (cx < 0 || cy < 0 || cx > (W >> 4) || cy > (H >> 4)) continue;
        const key = (cy << 8) | cx;
        used.add(key);
        let ch = this.chunks.get(key);
        if (!ch) {
          const px = 16 * TILE * this.chunkScale;
          ch = { canvas: makeBuffer(px, px), dirty: true };
          ch.ctx = ch.canvas.getContext('2d');
          this.chunks.set(key, ch);
        }
        if (ch.dirty) { this.paintChunk(ch, cx, cy); ch.dirty = false; }
        ctx.drawImage(ch.canvas, cx * 16 * TILE, cy * 16 * TILE, 16 * TILE, 16 * TILE);
      }
    }
    // держим в памяти только куски рядом с экраном
    if (this.chunks.size > used.size + 12) {
      for (const key of [...this.chunks.keys()]) if (!used.has(key)) this.chunks.delete(key);
    }
  }

  /** Перерисовать один кусок ландшафта: задняя стена, порода, кромки, мох, трещины. */
  paintChunk(ch, cx, cy) {
    const w = this.world;
    const g = ch.ctx;
    const S = this.chunkScale;
    g.setTransform(S, 0, 0, S, 0, 0);
    g.clearRect(0, 0, 16 * TILE, 16 * TILE);
    const bx = cx * 16, by = cy * 16;
    for (let ty = 0; ty < 16; ty++) {
      for (let tx = 0; tx < 16; tx++) {
        const x = bx + tx, y = by + ty;
        if (x < 0 || y < 0 || x >= W || y >= H) continue;
        const i = y * W + x;
        const px = tx * TILE, py = ty * TILE;
        const m = w.mat[i];

        if (!m) {
          const bm = w.back[i];
          if (!bm) continue;                       // космос рисуется отдельно
          const hb = hash(x + 11, y + 5);
          const tex = this.tex.back(bm, (hb * 8) | 0);
          if (tex) g.drawImage(tex, px, py, TILE, TILE);
          const jit = this.shade[i] * 0.06 + (hb - 0.5) * 0.03;
          g.fillStyle = jit > 0 ? `rgba(210,232,255,${jit})` : `rgba(2,8,14,${-jit})`;
          g.fillRect(px, py, TILE, TILE);
          let ao = 0;
          if (w.mat[i - 1]) ao += 1;
          if (w.mat[i + 1]) ao += 1;
          if (w.mat[i - W]) ao += 1.4;
          if (w.mat[i + W]) ao += 0.6;
          if (ao > 0) {
            g.fillStyle = `rgba(3,8,14,${Math.min(0.32, ao * 0.06)})`;
            g.fillRect(px, py, TILE, TILE);
          }
          continue;
        }

        const h = hash(x, y);
        const tex = this.tex.tile(m, (h * 8) | 0);
        if (tex) g.drawImage(tex, px, py, TILE, TILE);
        else { g.fillStyle = MATS[m].color; g.fillRect(px, py, TILE, TILE); }

        const up = !w.mat[i - W], down = !w.mat[i + W];
        const left = !w.mat[i - 1], right = !w.mat[i + 1];
        const buried = !up && !down && !left && !right;
        const tone = this.shade[i] * 0.07 + (h - 0.5) * 0.03 - (buried ? 0.06 : 0);
        if (Math.abs(tone) > 0.01) {
          g.fillStyle = tone > 0 ? `rgba(255,246,228,${tone})` : `rgba(4,10,16,${-tone})`;
          g.fillRect(px, py, TILE, TILE);
        }

        const E = this.tex.edges;
        if (up) g.drawImage(E.top, px, py, TILE, TILE);
        if (down) g.drawImage(E.bottom, px, py, TILE, TILE);
        if (left) g.drawImage(E.left, px, py, TILE, TILE);
        if (right) g.drawImage(E.right, px, py, TILE, TILE);

        const corner = (a, b, ox, oy, sx, sy) => {
          if (!a || !b) return;
          g.fillStyle = 'rgba(6,12,18,.55)';
          g.beginPath();
          g.moveTo(ox, oy);
          g.lineTo(ox + sx * 3.2, oy);
          g.quadraticCurveTo(ox, oy, ox, oy + sy * 3.2);
          g.closePath();
          g.fill();
        };
        corner(up, left, px, py, 1, 1);
        corner(up, right, px + TILE, py, -1, 1);
        corner(down, left, px, py + TILE, 1, -1);
        corner(down, right, px + TILE, py + TILE, -1, -1);

        if (up && (m === 1 || m === 7 || m === 9)) this.moss(g, px, py, x, y, m);

        const dp = w.digProg[i];
        if (dp > 0) this.drawCracks(g, px, py, Math.min(1, dp / 10), hash(x + 3, y + 5));
      }
    }
    g.setTransform(1, 0, 0, 1, 0, 0);
  }

  /** Пучки мха на верхней кромке грунта — оживляют силуэт пещеры. */
  moss(ctx, px, py, x, y, m) {
    const base = m === 9 ? '#7fae52' : m === 7 ? '#6fa554' : '#5f8d43';
    ctx.strokeStyle = base;
    ctx.lineWidth = 0.9;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (let k = 0; k < 4; k++) {
      const h = hash(x * 7 + k, y * 13);
      if (h < 0.45) continue;
      const bx = px + 2 + k * 3.6 + h * 1.5;
      const len = 1.6 + h * 2.6;
      ctx.moveTo(bx, py + 0.5);
      ctx.lineTo(bx + (h - 0.5) * 1.6, py - len);
    }
    ctx.stroke();
  }

  drawCracks(ctx, px, py, k, seed) {
    ctx.save();
    ctx.strokeStyle = `rgba(20,12,8,${0.35 + k * 0.5})`;
    ctx.lineWidth = 0.7 + k;
    ctx.beginPath();
    const cx = px + TILE / 2, cy = py + TILE / 2;
    const arms = 3 + Math.floor(k * 3);
    for (let a = 0; a < arms; a++) {
      const ang = (a / arms) * Math.PI * 2 + seed * 6;
      const len = (TILE / 2) * (0.35 + k * 0.7);
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(ang) * len, cy + Math.sin(ang) * len * 0.85);
    }
    ctx.stroke();
    ctx.restore();
  }

  // ----------------------------------------------------------------- вода
  drawLiquid(ctx, { x0, x1, y0, y1 }) {
    const w = this.world;
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const i = y * W + x;
        const m = w.water[i];
        if (m < 1 || w.mat[i]) continue;
        const f = Math.min(1, m / LIQ_FULL);
        const open = w.water[i - W] < 1 && !w.mat[i - W];
        const wave = open ? Math.sin(this.t * 1.6 + x * 0.7) * 0.7 : 0;
        const hgt = Math.max(1.5, f * TILE);
        const px = x * TILE, py = y * TILE + TILE - hgt + wave;
        const dirty = w.pwater[i] > 0.4;
        const hot = w.temp[i] > 60;

        ctx.fillStyle = dirty ? 'rgba(96,112,58,.88)' : hot ? 'rgba(84,144,196,.86)' : 'rgba(42,104,176,.86)';
        ctx.fillRect(px, py, TILE, hgt + 1);
        // толща воды темнее у дна — объём без градиента на каждый тайл
        ctx.fillStyle = 'rgba(6,26,54,.28)';
        ctx.fillRect(px, py + hgt * 0.55, TILE, hgt * 0.45 + 1);

        if (open) {
          // блик и пена по поверхности
          ctx.fillStyle = dirty ? 'rgba(196,214,130,.65)' : 'rgba(190,230,255,.7)';
          ctx.fillRect(px, py, TILE, 1.5);
          ctx.fillStyle = 'rgba(255,255,255,.18)';
          ctx.fillRect(px + 2 + Math.sin(this.t * 2 + x) * 2, py + 2, 4, 1);
        }
      }
    }
  }

  // ------------------------------------------------ газы мягкими облаками
  drawGasClouds(ctx, { x0, x1, y0, y1 }) {
    const w = this.world;
    const g = this.gasCtx;
    g.clearRect(x0, y0, x1 - x0 + 1, y1 - y0 + 1);
    let any = false;
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const i = y * W + x;
        if (w.mat[i]) continue;
        const o2 = w.o2[i], co2 = w.co2[i], st = w.steam[i], h2 = w.h2[i];
        const total = o2 + co2 + st + h2;
        if (total < 0.03) continue;
        // цвет — смесь газов, прозрачность — давление
        const r = (o2 * 120 + co2 * 108 + st * 232 + h2 * 198) / total;
        const gg = (o2 * 196 + co2 * 104 + st * 238 + h2 * 158) / total;
        const b = (o2 * 232 + co2 * 98 + st * 244 + h2 * 234) / total;
        const heavy = (co2 + st + h2) / total;
        const a = Math.min(0.42, (total / GAS_CAP) * (0.13 + heavy * 0.3));
        g.fillStyle = `rgba(${r | 0},${gg | 0},${b | 0},${a})`;
        g.fillRect(x, y, 1, 1);
        any = true;
      }
    }
    if (!any) return;
    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(this.gasBuf, x0, y0, x1 - x0 + 1, y1 - y0 + 1,
      x0 * TILE, y0 * TILE, (x1 - x0 + 1) * TILE, (y1 - y0 + 1) * TILE);
    ctx.restore();
  }

  // --------------------------------------------------------------- освещение
  drawLighting(ctx, { x0, x1, y0, y1 }, game) {
    const w = this.world;
    const l = this.lightCtx;
    const night = game.cycleT > 0.75;
    l.clearRect(x0, y0, x1 - x0 + 1, y1 - y0 + 1);
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const i = y * W + x;
        const lit = Math.min(1, w.light[i] * (night ? 0.6 : 1));
        const k = 0.68 + lit * 0.36;                       // ниже 0.68 не темнеем — читаемость
        const rr = Math.min(255, 255 * k * (0.88 + lit * 0.16));
        const gg = Math.min(255, 255 * k * 0.95);
        const bb = Math.min(255, 255 * k * (1.06 - lit * 0.08));
        l.fillStyle = `rgb(${rr | 0},${gg | 0},${bb | 0})`;
        l.fillRect(x, y, 1, 1);
      }
    }
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(this.lightBuf, x0, y0, x1 - x0 + 1, y1 - y0 + 1,
      x0 * TILE, y0 * TILE, (x1 - x0 + 1) * TILE, (y1 - y0 + 1) * TILE);

    // тёплое сияние ламп и работающих машин
    ctx.globalCompositeOperation = 'lighter';
    for (const [, st] of w.bdata) {
      if (!st.built || st.x < x0 - 6 || st.x > x1 + 6 || st.y < y0 - 6 || st.y > y1 + 6) continue;
      const lamp = st.def.light && st.powered;
      const hot = st.def.uses === 'coal' && st.burning;
      if (!lamp && !hot) continue;
      const cx = st.x * TILE + TILE / 2, cy = st.y * TILE + TILE / 2;
      const r = lamp ? st.def.light * TILE : TILE * 2.2;
      const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      grd.addColorStop(0, lamp ? 'rgba(255,220,150,.42)' : 'rgba(255,140,60,.38)');
      grd.addColorStop(1, 'rgba(255,200,120,0)');
      ctx.fillStyle = grd;
      ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    }
    ctx.restore();
  }

  // --------------------------------------------------------------- частицы
  spawn(p) { if (this.particles.length < 900) this.particles.push(p); }

  updateParticles(ctx, game, dt, view) {
    const w = this.world;
    // события от игры: пыль при добыче, брызги
    if (game.fx && game.fx.length) {
      for (const e of game.fx) {
        for (let n = 0; n < (e.big ? 14 : 5); n++) {
          this.spawn({
            x: e.x * TILE + TILE / 2 + (Math.random() - 0.5) * TILE,
            y: e.y * TILE + TILE / 2 + (Math.random() - 0.5) * TILE,
            vx: (Math.random() - 0.5) * 18, vy: -Math.random() * 16,
            life: 0.5 + Math.random() * 0.6, max: 1.1,
            color: e.color || '#c8b49a', size: 0.8 + Math.random() * 1.4, grav: 42,
          });
        }
      }
      game.fx.length = 0;
    }
    // пузырьки в воде и пылинки в освещённом воздухе
    if (Math.random() < dt * 22) {
      const x = view.x0 + Math.floor(Math.random() * (view.x1 - view.x0 + 1));
      const y = view.y0 + Math.floor(Math.random() * (view.y1 - view.y0 + 1));
      const i = y * W + x;
      if (!w.mat[i] && w.water[i] > 200) {
        this.spawn({
          x: x * TILE + Math.random() * TILE, y: y * TILE + TILE,
          vx: (Math.random() - 0.5) * 3, vy: -8 - Math.random() * 8,
          life: 1 + Math.random(), max: 2, color: 'rgba(200,235,255,.75)',
          size: 0.6 + Math.random(), grav: 0,
        });
      } else if (!w.mat[i] && w.light[i] > 0.5) {
        this.spawn({
          x: x * TILE + Math.random() * TILE, y: y * TILE + Math.random() * TILE,
          vx: (Math.random() - 0.5) * 4, vy: -1 - Math.random() * 3,
          life: 1.5 + Math.random(), max: 2.6, color: 'rgba(255,240,200,.5)',
          size: 0.5, grav: -1,
        });
      }
    }

    for (let k = this.particles.length - 1; k >= 0; k--) {
      const p = this.particles[k];
      p.life -= dt;
      if (p.life <= 0) { this.particles.splice(k, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.grav || 0) * dt;
      const a = Math.max(0, Math.min(1, p.life / (p.max || 1)));
      ctx.fillStyle = p.color.startsWith('rgba') ? p.color : p.color;
      ctx.globalAlpha = a;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // ------------------------------------------------------- трубы и провода
  drawConduits(ctx, { x0, x1, y0, y1 }) {
    const w = this.world;
    const styles = { power: ['#d8b25a', 2], liquid: ['#4d9ad6', 3.2], gas: ['#b98ad8', 3.2], auto: ['#7ed957', 1.6] };
    for (const kind of ['liquid', 'gas', 'power', 'auto']) {
      const arr = w.cond[kind];
      const [color, width] = styles[kind];
      const off = kind === 'power' ? -4 : kind === 'liquid' ? 0 : kind === 'gas' ? 4 : 6;
      for (let y = y0; y <= y1; y++) {
        for (let x = x0; x <= x1; x++) {
          const i = y * W + x;
          if (!arr[i]) continue;
          const st = w.bdata.get(i * 8 + LAYER[kind]);
          const built = st && st.built;
          const cx = x * TILE + TILE / 2, cy = y * TILE + TILE / 2 + off;
          const links = [];
          for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            if (arr[(y + dy) * W + (x + dx)]) links.push([dx, dy]);
          }
          ctx.globalAlpha = built ? 1 : 0.35;
          // тень трубы, затем сама труба и блик — получается объём
          for (const pass of [0, 1, 2]) {
            ctx.strokeStyle = pass === 0 ? 'rgba(0,0,0,.45)' : pass === 1 ? color : 'rgba(255,255,255,.35)';
            ctx.lineWidth = pass === 0 ? width + 1.4 : pass === 1 ? width : width * 0.35;
            ctx.lineCap = 'round';
            ctx.beginPath();
            const yo = pass === 2 ? -width * 0.22 : 0;
            if (!links.length) { ctx.moveTo(cx - 3, cy + yo); ctx.lineTo(cx + 3, cy + yo); }
            for (const [dx, dy] of links) {
              ctx.moveTo(cx, cy + yo);
              ctx.lineTo(cx + dx * TILE / 2, cy + dy * TILE / 2 + yo);
            }
            ctx.stroke();
          }
          ctx.globalAlpha = 1;
        }
      }
    }
  }

  // ------------------------------------------------------------- постройки
  drawBuildings(ctx, { x0, x1, y0, y1 }) {
    const w = this.world;
    for (const [, st] of w.bdata) {
      const x = st.x, y = st.y;
      if (x < x0 || x > x1 || y < y0 || y > y1) continue;
      if (st.def.conduit) continue;
      const px = x * TILE, py = y * TILE, def = st.def;
      if (!st.built) {
        ctx.strokeStyle = 'rgba(90,220,235,.85)';
        ctx.setLineDash([3, 3]); ctx.lineWidth = 1.2;
        ctx.strokeRect(px + 1.5, py + 1.5, TILE - 3, TILE - 3);
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(70,200,220,.14)';
        ctx.fillRect(px + 1.5, py + 1.5, TILE - 3, TILE - 3);
        const frac = st.prog / def.work;
