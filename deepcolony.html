<title>Deep Colony</title>
<style>
:root{
  color-scheme:dark;   /* игра живёт в одном тёмном мире, как ONI */
  --bg:#0d1b21;
  --panel:#14282f;
  --panel2:#1b3540;
  --edge:#2b5361;
  --text:#dff3f4;
  --dim:#8fb3b8;
  --accent:#ffb43d;
  --accent2:#48c9d6;
  --good:#7ed957;
  --bad:#ff6b5e;
  --shadow:0 6px 18px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0}
canvas#view{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;image-rendering:auto;touch-action:none}

/* ---------- top bar ---------- */
#topbar{position:absolute;top:0;left:0;right:0;min-height:52px;display:flex;align-items:center;gap:18px;
  padding:env(safe-area-inset-top,0px) 14px 0;background:linear-gradient(180deg,rgba(20,40,47,.97),rgba(20,40,47,.82));
  border-bottom:2px solid var(--edge);box-shadow:var(--shadow);z-index:5}
.brand{font-weight:bold;letter-spacing:2px;color:var(--accent);font-size:18px}
.brand span{color:var(--accent2)}
.res{display:flex;gap:8px;flex:1;flex-wrap:nowrap;overflow:hidden;font-size:12px}
.res .r{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--edge);
  border-radius:16px;padding:3px 10px}
.res .r b{color:var(--accent);font-weight:600}
.res .r i{font-style:normal;opacity:.75}
.clock{display:flex;align-items:center;gap:12px}
.cycle{font-size:13px;color:var(--dim)}
.speeds{display:flex;gap:4px}
.spd{background:var(--panel2);color:var(--dim);border:1px solid var(--edge);border-radius:8px;
  padding:5px 9px;cursor:pointer;font-size:12px}
.spd.active{background:var(--accent);color:#22313a;border-color:var(--accent);font-weight:bold}

/* ---------- sidebar ---------- */
#sidebar{position:absolute;top:60px;right:8px;bottom:120px;width:270px;display:flex;flex-direction:column;gap:8px;z-index:4;overflow-y:auto}
.panel{background:rgba(20,40,47,.94);border:2px solid var(--edge);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.panel-title{background:var(--panel2);padding:6px 10px;font-size:12px;letter-spacing:1px;color:var(--accent2);
  text-transform:uppercase;border-bottom:1px solid var(--edge)}
.panel-body{padding:8px 10px;font-size:12px;max-height:34vh;overflow:auto;line-height:1.5}
.panel-body::-webkit-scrollbar{width:7px}
.panel-body::-webkit-scrollbar-thumb{background:var(--edge);border-radius:4px}
.kv{display:flex;justify-content:space-between;gap:8px}
.kv span:last-child{color:var(--accent)}
.sep{height:1px;background:var(--edge);margin:6px 0}

/* colonist cards */
.col-card{border:1px solid var(--edge);border-radius:8px;padding:6px;margin-bottom:6px;background:var(--panel2);cursor:pointer}
.col-card.sel{border-color:var(--accent)}
.col-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.col-name{font-weight:bold}
.col-task{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.bar{height:6px;background:#0c1c22;border-radius:4px;overflow:hidden;margin:2px 0}
.bar i{display:block;height:100%;border-radius:4px}
.blabel{font-size:10px;color:var(--dim);display:flex;justify-content:space-between}

/* ---------- toolbar ---------- */
#toolbar{position:absolute;left:0;right:0;bottom:0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,rgba(20,40,47,.98),rgba(20,40,47,.86));
  border-top:2px solid var(--edge);padding:6px 10px 8px;z-index:5;box-shadow:0 -6px 18px rgba(0,0,0,.4)}
.tabs{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.tab{background:var(--panel2);border:1px solid var(--edge);color:var(--dim);border-radius:8px 8px 0 0;
  padding:4px 12px;font-size:12px;cursor:pointer}
.tab.active{background:var(--accent);color:#22313a;font-weight:bold;border-color:var(--accent)}
.tools{display:flex;gap:6px;flex-wrap:wrap;min-height:58px}
.tool{width:74px;background:var(--panel2);border:1px solid var(--edge);border-radius:10px;padding:5px 4px;
  text-align:center;cursor:pointer;transition:.12s}
.tool:hover{border-color:var(--accent2);transform:translateY(-2px)}
.tool.active{border-color:var(--accent);background:#2a4550;box-shadow:0 0 0 1px var(--accent) inset}
.tool .ic{font-size:19px;line-height:1.1}
.tool .nm{font-size:10px;color:var(--dim);margin-top:2px}
.tool .cost{font-size:9px;color:var(--accent)}
.hint{font-size:11px;color:var(--dim);margin-top:5px}

/* ---------- overlays / alerts ---------- */
#overlay-toggles{position:absolute;left:8px;top:60px;display:flex;flex-direction:column;gap:5px;z-index:4}
.ov{background:rgba(20,40,47,.92);border:1px solid var(--edge);color:var(--dim);border-radius:8px;
  padding:5px 10px;font-size:11px;cursor:pointer;text-align:left}
.ov.active{border-color:var(--accent2);color:var(--accent2)}
#alerts{position:absolute;left:50%;top:62px;transform:translateX(-50%);z-index:6;display:flex;
  flex-direction:column;gap:5px;align-items:center;pointer-events:none}
.alert{background:rgba(40,20,20,.95);border:1px solid var(--bad);color:#ffd9d4;padding:5px 14px;
  border-radius:16px;font-size:12px;animation:pop .25s ease}
.alert.info{background:rgba(20,45,50,.95);border-color:var(--accent2);color:#d6f6fa}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
.alert.fade{opacity:0;transform:translateY(-4px);transition:opacity .35s ease,transform .35s ease}

/* исследования и приоритеты */
.tech{border:1px solid var(--edge);border-radius:8px;padding:5px 7px;margin-bottom:5px;background:var(--panel2);cursor:pointer}
.tech:hover{border-color:var(--accent2)}
.tech.active{border-color:var(--accent)}
.tech.done{opacity:.55;cursor:default}
.tech b{color:var(--accent2)}
.tech .d{font-size:10px;color:var(--dim)}
.prio{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.prio span{font-size:10px;border:1px solid var(--edge);border-radius:6px;padding:1px 5px;cursor:pointer;background:#10232a}
.prio span.off{opacity:.35;text-decoration:line-through}
.tool.locked{opacity:.4;cursor:not-allowed}

.sched{display:flex;gap:2px}
.sched div{flex:1;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-size:11px;cursor:pointer;border:1px solid var(--edge)}
.sched div.now{outline:2px solid var(--accent)}
.hint2{font-size:10px;color:var(--dim);margin-top:4px}
.prio span.p5{border-color:var(--accent);color:var(--accent)}
.prio span.p1{opacity:.6}
.rel{font-size:10px;color:var(--dim)}

/* узкие экраны и планшеты: панели ужимаются, кнопки остаются нажимаемыми пальцем */
@media (max-width:820px){
  .brand{font-size:14px;letter-spacing:1px}

  .res .r{padding:2px 7px;font-size:11px}
  #overlay-toggles{top:56px}
  .ov{padding:4px 7px;font-size:10px}

@media (max-width:560px){

  .tool{width:58px}

// Мелкие утилиты: ГПСЧ, шум, математика, имена.

function makeRNG(seed = 1337) {
  let s = seed >>> 0;
  return function rng() {
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5;  s >>>= 0;
    return s / 4294967296;
  };
}

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const dist2 = (ax, ay, bx, by) => (ax - bx) ** 2 + (ay - by) ** 2;

/** Двумерный value-noise с решёткой заданного масштаба. */
function makeNoise2D(rng) {
  const size = 256;
  const grid = new Float32Array(size * size);
  for (let i = 0; i < grid.length; i++) grid[i] = rng();
  const at = (x, y) => grid[(((y % size) + size) % size) * size + (((x % size) + size) % size)];
  return function noise(x, y) {
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const tx = smooth(x - x0), ty = smooth(y - y0);
    return lerp(
      lerp(at(x0, y0), at(x0 + 1, y0), tx),
      lerp(at(x0, y0 + 1), at(x0 + 1, y0 + 1), tx),
      ty
    );
  };
}

/** Фрактальный шум из нескольких октав. */
function fbm(noise, x, y, octaves = 4, lacunarity = 2, gain = 0.5) {
  let amp = 1, freq = 1, sum = 0, norm = 0;
  for (let i = 0; i < octaves; i++) {
    sum += noise(x * freq, y * freq) * amp;
    norm += amp;
    amp *= gain; freq *= lacunarity;
  }
  return sum / norm;
}

function pick(rng, arr) { return arr[Math.floor(rng() * arr.length) % arr.length]; }

const FIRST = ['Ая', 'Бим', 'Вега', 'Гор', 'Дина', 'Ёж', 'Жора', 'Зина', 'Иго', 'Кира',

function randomName(rng) { return `${pick(rng, FIRST)} ${pick(rng, LAST)}`; }

/** Форматирование массы в стиле ONI. */

// Мир: материалы, постройки, генерация карты, доступ к тайлам.

const W = 128, H = 84, TILE = 16;

// ---------------------------------------------------------------- материалы
const MATS = [
  null, // 0 — пустота (газ)
  { id: 1, name: 'Грунт',        color: '#7c5230', color2: '#573720', hard: 1.0, yield: 'dirt',   amount: 8,  heat: 25 },

];

const RESOURCES = {
  dirt:   { name: 'Грунт',      icon: '🟤' },
  stone:  { name: 'Камень',     icon: '🪨' },
  coal:   { name: 'Уголь',      icon: '⚫' },
  copper: { name: 'Медь',       icon: '🟠' },
  ice:    { name: 'Лёд',        icon: '🧊' },
  algae:  { name: 'Водоросли',  icon: '🟢' },
  slime:  { name: 'Слизь',      icon: '🟩' },

// Постройки вынесены в buildings.js

const LAYER = { power: 1, liquid: 2, gas: 3, auto: 4 };
const GAS_CAP = 2.2;      // кг/тайл — «комфортное» давление
const BREATH_MIN = 0.12;  // ниже этого дупликант задыхается

class World {
  constructor(seed = Date.now() & 0xffff) {
    this.seed = seed;
    this.rng = makeRNG(seed || 1);
    this.mat = new Uint8Array(W * H);
    this.back = new Uint8Array(W * H);      // «задняя стена» биома — фон за выкопанным
    this.digProg = new Float32Array(W * H);
    this.dig = new Uint8Array(W * H);       // помечено к добыче
    this.bid = new Uint8Array(W * H);       // здания (слой 0)
    this.cond = {                            // слои коммуникаций, как в ONI
      power: new Uint8Array(W * H),
      liquid: new Uint8Array(W * H),
      gas: new Uint8Array(W * H),
      auto: new Uint8Array(W * H),
    };
    this.bdata = new Map();                 // key(x,y,layer) -> состояние постройки
    this.items = new Map();                 // idx -> {res: кг}
    this.o2 = new Float32Array(W * H);
    this.co2 = new Float32Array(W * H);
    this.steam = new Float32Array(W * H);
    this.h2 = new Float32Array(W * H);
    this.water = new Float32Array(W * H);   // кг воды в тайле
    this.pwater = new Float32Array(W * H);  // доля загрязнённой воды 0..1
    this.germs = new Float32Array(W * H);   // условные единицы микробов
    this.phase = new Float32Array(W * H);   // накопленный фазовый переход (таяние/замерзание), кг
    this.vents = [];
    this.dirtyChunks = new Set();   // какие куски ландшафта перерисовать
    this.temp = new Float32Array(W * H);
    this.light = new Float32Array(W * H);
    this.generate();
  }

  idx(x, y) { return y * W + x; }
  /** Пометить тайл как изменившийся — рендер перерисует его кусок карты. */
  markDirty(x, y) {
    const cx = x >> 4, cy = y >> 4;
    for (let dx = -1; dx <= 1; dx++)
      for (let dy = -1; dy <= 1; dy++) this.dirtyChunks.add(((cy + dy) << 8) | (cx + dx));
  }
  /** Ключ в bdata: слой 0 — здание, 1/2/3 — провод/труба/вентиляция. */
  key(x, y, layer = 0) { return (y * W + x) * 8 + layer; }
  static layerOf(def) { return def.conduit ? LAYER[def.conduit] : 0; }
  stateAt(x, y, layer = 0) { return this.bdata.get(this.key(x, y, layer)) || null; }
  inside(x, y) { return x >= 0 && y >= 0 && x < W && y < H; }
  matAt(x, y) { return this.inside(x, y) ? this.mat[y * W + x] : 8; }
  buildAt(x, y) { return this.inside(x, y) ? this.bid[y * W + x] : 0; }
  bdef(x, y) { return BUILDINGS[this.buildAt(x, y)] || null; }
  bstate(x, y) { return this.bdata.get(this.key(x, y, 0)) || null; }
  /** Все постройки тайла по слоям. */
  allAt(x, y) {
    const out = [];
    for (let l = 0; l < 5; l++) { const st = this.bdata.get(this.key(x, y, l)); if (st) out.push(st); }
    return out;
  }

  /** Тайл перекрывает газ и жидкость (порода, стена или закрытая дверь). */
  gasBlocked(i) {
    if (this.mat[i]) return true;
    const b = BUILDINGS[this.bid[i]];
    if (!b || (!b.solid && !b.door)) return false;
    const st = this.bdata.get(i * 8);
    return !!(st && st.built);
  }

  /** Тайл непроходим (порода или достроенная стена). */
  solid(x, y) {
    if (!this.inside(x, y)) return true;
    const i = y * W + x;
    if (this.mat[i]) return true;
    const b = BUILDINGS[this.bid[i]];
    const st = this.bdata.get(i * 8);
    return !!(b && b.solid && st && st.built);
  }

  /** На этом тайле можно стоять (есть опора снизу или лестница). */
  standable(x, y) {
    if (this.solid(x, y)) return false;
    const b = BUILDINGS[this.bid[y * W + x]];
    const st = this.bdata.get((y * W + x) * 8);
    if (b && b.climb && st && st.built) return true;
    if (this.solid(x, y + 1)) return true;
    const bb = BUILDINGS[this.bid[(y + 1) * W + x]] , bs = this.bdata.get(((y + 1) * W + x) * 8);
    return !!(bb && (bb.floor || bb.climb) && bs && bs.built);
  }

  climbable(x, y) {
    const b = BUILDINGS[this.bid[y * W + x]], st = this.bdata.get((y * W + x) * 8);
    return !!(b && b.climb && st && st.built);
  }

  // ------------------------------------------------------------- генерация
  generate() {
    const n1 = makeNoise2D(this.rng), n2 = makeNoise2D(this.rng), n3 = makeNoise2D(this.rng);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        if (x === 0 || y === 0 || x === W - 1 || y === H - 1) { this.mat[i] = 8; continue; }

        const depth = y / H;
        const surface = 8 + fbm(n1, x * 0.035, 0.5, 4) * 7;
        if (y < surface) { this.mat[i] = 0; this.back[i] = 0; continue; }   // космос над поверхностью

        const cave = fbm(n2, x * 0.07, y * 0.09, 4);
        const hollow = cave > 0.63 && y > surface + 3;

        let m = 1;
        if (depth > 0.22) m = 2;
        if (depth > 0.55) m = 3;
        const ore = fbm(n3, x * 0.12 + 40, y * 0.12, 3);
        if (ore > 0.70 && depth > 0.3) m = 4;                       // уголь
        else if (ore < 0.27 && depth > 0.25) m = 5;                 // медь
        if (depth > 0.75 && fbm(n2, x * 0.05 - 20, y * 0.05, 2) > 0.58) m = 6; // ледяной биом
        if (depth < 0.35 && cave > 0.55 && cave <= 0.63) m = 7;     // водоросли у пещер
        if (depth > 0.38 && depth < 0.62 && cave > 0.52 && cave <= 0.63) m = 9;  // болото со слизью
        if (depth > 0.38 && depth < 0.62 && ore > 0.62 && m === 2) m = 10;       // загрязнённый грунт
        if (depth > 0.92) m = 8;
        this.back[i] = m;
        this.mat[i] = hollow ? 0 : m;
        this.temp[i] = MATS[m].heat;
      }
    }

    // стартовая каверна с кислородом
    const cx = (W >> 1), cy = Math.floor(H * 0.30);
    for (let y = cy - 6; y <= cy + 5; y++) {
      for (let x = cx - 11; x <= cx + 11; x++) {
        if (!this.inside(x, y)) continue;
        const d = ((x - cx) / 11) ** 2 + ((y - cy) / 6) ** 2;
        if (d < 1) {
          const i = y * W + x;
          if (!this.back[i]) this.back[i] = 1;
          this.mat[i] = 0; this.o2[i] = 2.2; this.co2[i] = 0; this.temp[i] = 22;
        }
      }
    }
    // герметичная скорлупа вокруг стартовой каверны — базу надо вскрывать самому
    for (let y = cy - 8; y <= cy + 7; y++) {
      for (let x = cx - 14; x <= cx + 14; x++) {
        if (!this.inside(x, y)) continue;
        const d = ((x - cx) / 11) ** 2 + ((y - cy) / 6) ** 2;
        if (d >= 1 && d < 1.6) {
          const i = y * W + x;
          if (!this.mat[i]) { this.mat[i] = 2; this.temp[i] = MATS[2].heat; if (!this.back[i]) this.back[i] = 2; }
          this.o2[i] = 0; this.co2[i] = 0; this.water[i] = 0;
        }
      }
    }

    // пол каверны
    for (let x = cx - 11; x <= cx + 11; x++) {
      const y = cy + 5;
      if (this.inside(x, y) && !this.mat[y * W + x]) this.mat[y * W + x] = 2;
    }
    this.start = { x: cx, y: cy + 4 };

    // подземные водоёмы: пещеры ниже середины карты заполняются водой
    for (let y = Math.floor(H * 0.58); y < H - 2; y++) {
      for (let x = 1; x < W - 1; x++) {
        const i = y * W + x;
        if (this.mat[i]) continue;
        let roof = false;
        for (let k = 1; k <= 3; k++) if (this.mat[i - k * W]) { roof = true; break; }
        if (!roof) continue;
        this.water[i] = 1000;
        this.temp[i] = y / H > 0.8 ? 6 : 18;
        if (y / H > 0.72 && ((x * 31 + y * 17) % 7 === 0)) { this.pwater[i] = 1; this.germs[i] = 200; }
      }
    }

    // гейзеры и вулканические жерла (подальше от базы)
    const ventTypes = ['steam', 'water', 'co2', 'h2'];
    for (let n = 0; n < 6; n++) {
      for (let tries = 0; tries < 400; tries++) {
        const x = 3 + Math.floor(this.rng() * (W - 6));
        const y = Math.floor(H * 0.35 + this.rng() * H * 0.55);
        const i = y * W + x;
        if (this.mat[i] || this.mat[i + W] === 0 || this.water[i] > 10) continue;
        if (Math.abs(x - this.start.x) < 16 && Math.abs(y - this.start.y) < 10) continue;  // не в базе
        const type = ventTypes[n % ventTypes.length];
        this.vents.push({ x, y, type, t: this.rng() * 200, period: 220 + this.rng() * 260, active: false, rate: 0.6 + this.rng() });
        break;
      }
    }

    // атмосфера в пустотах (немного кислорода в пещерах, углекислота внизу)
    for (let y = 1; y < H - 1; y++) {
      for (let x = 1; x < W - 1; x++) {
        const i = y * W + x;
        if (this.mat[i]) continue;
        if (this.o2[i] || this.co2[i]) continue;
        if (y < 9) continue;                     // космос сверху — вакуум
        const deep = y / H;
        this.o2[i] = 0.35 * (1 - deep) + 0.05;
        this.co2[i] = 0.25 * deep;
        this.temp[i] = 18 + deep * 12;
      }
    }
  }

  // --------------------------------------------------------------- предметы
  addItem(x, y, res, amt) {
    if (!this.inside(x, y) || amt <= 0) return;
    const i = this.idx(x, y);
    const pile = this.items.get(i) || {};
    pile[res] = (pile[res] || 0) + amt;
    this.items.set(i, pile);
  }
  takeItem(i, res, amt) {
    const pile = this.items.get(i);
    if (!pile || !pile[res]) return 0;
    const got = Math.min(pile[res], amt);
    pile[res] -= got;
    if (pile[res] <= 1e-6) delete pile[res];
    if (!Object.keys(pile).length) this.items.delete(i);
    return got;
  }

  // -------------------------------------------------------------- постройки
  canPlace(x, y, def) {
    const i = this.idx(x, y);
    if (!this.inside(x, y) || this.mat[i]) return false;
    if (def.conduit) return !this.cond[def.conduit][i];
    if (this.bid[i]) return false;
    if (def.climb || def.solid || def.door) return true;
    return this.standable(x, y) || this.solid(x, y + 1);
  }

  place(x, y, def) {
    const i = this.idx(x, y);
    this.markDirty(x, y);
    const layer = World.layerOf(def);
    if (def.conduit) this.cond[def.conduit][i] = def.id; else this.bid[i] = def.id;
    this.bdata.set(this.key(x, y, layer),
      { built: false, prog: 0, def, x, y, layer, store: {}, charge: 0, growth: 0, powered: false, net: {} });
    this.netDirty = true;
  }

  removeBuilding(x, y, layer = 0) {
    const i = this.idx(x, y);
    this.markDirty(x, y);
    const k = this.key(x, y, layer);
    const st = this.bdata.get(k);
    if (!st) return;
    if (st.built) {
      for (const [res, amt] of Object.entries(st.def.cost)) this.addItem(x, y, res, amt * 0.5);
      for (const [res, amt] of Object.entries(st.store || {})) this.addItem(x, y, res, amt);
    }
    if (st.def.conduit) this.cond[st.def.conduit][i] = 0; else this.bid[i] = 0;
    this.bdata.delete(k);
    this.netDirty = true;
  }

  /** Добыча тайла: возвращает true, когда порода разрушена. */
  mine(x, y, work) {
    const i = this.idx(x, y);
    const m = MATS[this.mat[i]];
    if (!m || m.hard === Infinity) return false;
    this.digProg[i] += work / m.hard;
    this.markDirty(x, y);
    if (this.digProg[i] < 10) return false;
    this.mat[i] = 0;
    this.digProg[i] = 0;
    this.dig[i] = 0;
    if (m.germs) this.germs[i] += 250;          // вскрытая слизь пылит микробами
    if (m.yield) this.addItem(x, y, m.yield, m.amount);
    this.temp[i] = m.heat;
    return true;
  }
}

// ===== fluid.js ====================================================
// Физика флюидов: давление газа, плавучесть по плотности, жидкости со сжатием,
// фазовые переходы (лёд ↔ вода ↔ пар), перенос тепла вместе с массой.

// ---- газы: молярная масса (кг/кмоль) определяет, что всплывает, а что оседает
const GASES = [
  { key: 'o2',    name: 'Кислород',       M: 32, color: [120, 200, 235] },
  { key: 'co2',   name: 'Углекислый газ', M: 44, color: [120, 120, 130] },
  { key: 'steam', name: 'Водяной пар',    M: 18, color: [225, 235, 240] },
  { key: 'h2',    name: 'Водород',        M: 2,  color: [200, 160, 235] },
];

const LIQ_FULL = 1000;     // кг воды в «полном» тайле
const LIQ_MAX_COMP = 1.03;        // сжатие столба
const LIQ_FLOW = 420;             // максимум переноса за шаг, кг
const GAS_DIFF = 0.26;            // выравнивание давления газа
const GAS_SORT = 0.16;            // разделение по плотности
const HEAT_K = 0.055;

// удельная теплоёмкость, кДж/(кг·°C)
const C_GAS = 1.0, C_WATER = 4.18, C_SOLID = 0.8;
// скрытая теплота, кДж/кг
const L_FUSION = 334, L_VAPOR = 2260;
const ICE_MASS = 400, C_ICE = 2.0;

function stepFluids(world, dt) {
  stepLiquid(world, dt);
  stepGerms(world, dt);
  stepGas(world, dt);
  displaceGas(world);
  stepPhases(world, dt);
  stepHeat(world, dt);
}

function blockedAt(world, i) { return world.gasBlocked(i); }

/** Смешение температур при переносе массы m из a в b (mb — масса приёмника). */
function advect(temp, a, b, m, mb, c) {
  if (m <= 0) return;
  const cb = mb * c + 1e-6;
  temp[b] = (temp[b] * cb + temp[a] * m * c) / (cb + m * c);
}

// --------------------------------------------------------------- жидкости
function stepLiquid(world, dt) {
  const { water, temp } = world;
  const blocked = i => blockedAt(world, i);
  const stable = (total) => {
    // сколько должно остаться в нижней клетке вертикальной пары
    if (total <= LIQ_FULL) return total;
    if (total < 2 * LIQ_FULL * LIQ_MAX_COMP) return (LIQ_FULL * LIQ_MAX_COMP * LIQ_FULL + total) / (LIQ_FULL * LIQ_MAX_COMP + LIQ_FULL);
    return (total + LIQ_FULL * LIQ_MAX_COMP) / 2;
  };
  const flowLimit = LIQ_FLOW * Math.min(1, dt * 60);

  for (let y = H - 2; y >= 1; y--) {
    for (let x = 1; x < W - 1; x++) {
      const i = y * W + x;
      let w = water[i];
      if (w < 0.05 || blocked(i)) continue;
      let remaining = w;

      // вниз
      const d = i + W;
      if (!blocked(d)) {
        let f = stable(remaining + water[d]) - water[d];
        f = Math.max(0, Math.min(f, flowLimit, remaining));
        if (f > 0.01) {
          advect(temp, i, d, f, water[d], C_WATER);
          water[i] -= f; water[d] += f; remaining -= f;
        }
      }
      if (remaining < 0.05) continue;

      // в стороны
      for (const s of [i - 1, i + 1]) {
        if (blocked(s)) continue;
        let f = (remaining - water[s]) / 3;
        f = Math.max(0, Math.min(f, flowLimit, remaining));
        if (f > 0.01) {
          advect(temp, i, s, f, water[s], C_WATER);
          water[i] -= f; water[s] += f; remaining -= f;
        }
      }
      if (remaining < 0.05) continue;

      // вверх — только под давлением столба
      const u = i - W;
      if (!blocked(u)) {
        let f = remaining - stable(remaining + water[u]);
        f = Math.max(0, Math.min(f, flowLimit, remaining));
        if (f > 0.01) {
          advect(temp, i, u, f, water[u], C_WATER);
          water[i] -= f; water[u] += f;
        }
      }
    }
  }
}

// ------------------------------------------------------------------ газы
function totalGas(world, i) {
  return world.o2[i] + world.co2[i] + world.steam[i] + world.h2[i];
}

/** Доля объёма тайла, занятая жидкостью: чем больше воды, тем меньше места газу. */
function gasRoom(world, i) {
  return Math.max(0, 1 - world.water[i] / LIQ_FULL);
}

function stepGas(world, dt) {
  const arr = [world.o2, world.co2, world.steam, world.h2];
  const { temp } = world;
  const k = Math.min(0.5, GAS_DIFF * dt * 60);
  const ks = Math.min(0.4, GAS_SORT * dt * 60);
  const blocked = i => blockedAt(world, i);

  const move = (a, b, frac) => {
    // перенос доли frac всей газовой смеси из a в b + перенос тепла
    const ta = totalGas(world, a);
    if (ta <= 1e-6 || frac <= 0) return;
    const m = ta * frac;
    advect(temp, a, b, m, totalGas(world, b), C_GAS);
    for (const g of arr) { const d = g[a] * frac; g[a] -= d; g[b] += d; }
  };

  // 1. выравнивание давления (с поправкой на занятый водой объём)
  const pass = (ia, ib) => {
    if (blocked(ia) || blocked(ib)) return;
    const ra = gasRoom(world, ia), rb = gasRoom(world, ib);
    if (ra < 0.02 || rb < 0.02) return;
    const pa = totalGas(world, ia) / ra, pb = totalGas(world, ib) / rb;
    const diff = (pa - pb) * k * 0.5;
    if (Math.abs(diff) < 1e-5) return;
    if (diff > 0) move(ia, ib, Math.min(0.5, diff / Math.max(pa, 1e-6)));
    else move(ib, ia, Math.min(0.5, -diff / Math.max(pb, 1e-6)));
  };
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 2; x++) { const i = y * W + x; pass(i, i + 1); }
  for (let y = 1; y < H - 2; y++) for (let x = 1; x < W - 1; x++) { const i = y * W + x; pass(i, i + W); }

  // 2. разделение по плотности: тяжёлые газы вниз, лёгкие вверх
  for (let y = 1; y < H - 2; y++) {
    for (let x = 1; x < W - 1; x++) {
      const a = y * W + x, b = a + W;           // a сверху, b снизу
      if (blocked(a) || blocked(b)) continue;
      if (gasRoom(world, a) < 0.02 || gasRoom(world, b) < 0.02) continue;
      const ta = totalGas(world, a), tb = totalGas(world, b);
      if (ta < 1e-4 && tb < 1e-4) continue;
      for (let gi = 0; gi < arr.length; gi++) {
        const M = GASES[gi].M;
        // средняя молярная масса соседа — куда стремится эта фракция
        const Ma = meanM(world, a, ta), Mb = meanM(world, b, tb);
        const g = arr[gi];
        if (M > Mb + 0.5 && g[a] > 1e-5) {      // тяжелее нижнего — тонет
          const d = g[a] * ks * 0.5;
          advect(world.temp, a, b, d, tb, C_GAS);
          g[a] -= d; g[b] += d;
        } else if (M < Ma - 0.5 && g[b] > 1e-5) { // легче верхнего — всплывает
          const d = g[b] * ks * 0.5;
          advect(world.temp, b, a, d, ta, C_GAS);
          g[b] -= d; g[a] += d;
        }
      }
    }
  }

  // 3. космос сверху: атмосфера улетучивается
  for (let x = 1; x < W - 1; x++) {
    for (let y = 1; y < 6; y++) {
      const i = y * W + x;
      if (blocked(i)) continue;
      for (const g of arr) g[i] *= 0.90;
    }
  }
}

function meanM(world, i, total) {
  if (total <= 1e-6) return 29;
  return (world.o2[i] * 32 + world.co2[i] * 44 + world.steam[i] * 18 + world.h2[i] * 2) / total;
}

/** Вода вытесняет газ: из затопленных тайлов газ уходит вверх/в стороны. */
function displaceGas(world) {
  const arr = [world.o2, world.co2, world.steam, world.h2];
  for (let y = H - 2; y >= 1; y--) {
    for (let x = 1; x < W - 1; x++) {
      const i = y * W + x;
      if (world.water[i] < LIQ_FULL * 0.9) continue;
      const t = totalGas(world, i);
      if (t < 1e-4) continue;
      for (const n of [i - W, i - 1, i + 1]) {
        if (blockedAt(world, n) || world.water[n] > LIQ_FULL * 0.9) continue;
        for (const g of arr) { g[n] += g[i]; g[i] = 0; }
        break;
      }
    }
  }
}

// ------------------------------------------------------- фазовые переходы
function stepPhases(world, dt) {
  const { water, steam, temp, mat } = world;
  const rate = Math.min(1, dt * 1.5);
  for (let y = 1; y < H - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      const i = y * W + x;

      // --- лёд тает: сколько растает, ограничено доступным теплом
      if (mat[i] === 6) {
        if (temp[i] > 0) {
          const heat = temp[i] * ICE_MASS * C_ICE;          // кДж выше точки плавления
          const melted = Math.min(ICE_MASS, heat / L_FUSION) * Math.min(1, dt);
          world.phase[i] += melted;
          temp[i] -= melted * L_FUSION / (ICE_MASS * C_ICE);
          if (world.phase[i] >= ICE_MASS) {
            mat[i] = 0; world.digProg[i] = 0; world.phase[i] = 0;
            water[i] += ICE_MASS; temp[i] = 0;
            world.markDirty(x, y);
          }
        } else if (world.phase[i] > 0) {
          world.phase[i] = Math.max(0, world.phase[i] - 5 * dt);  // подмерзает обратно
        }
        continue;
      }

      if (mat[i]) continue;

      // --- вода замерзает: скрытая теплота греет остаток
      if (water[i] > 1 && temp[i] < 0) {
        const cool = -temp[i] * water[i] * C_WATER;
        const frozen = Math.min(water[i], cool / L_FUSION) * Math.min(1, dt);
        if (frozen > 0) {
          water[i] -= frozen;
          world.phase[i] += frozen;
          temp[i] += frozen * L_FUSION / (water[i] * C_WATER + 1);
          if (world.phase[i] >= ICE_MASS * 0.8 && water[i] < 30 && !world.bid[i]) {
            mat[i] = 6; world.phase[i] = 0; water[i] = 0; temp[i] = Math.min(temp[i], -0.5);
            world.markDirty(x, y);
            continue;
          }
        }
      } else if (world.phase[i] > 0 && temp[i] > 0.5) {
        world.phase[i] = Math.max(0, world.phase[i] - 5 * dt);
      }
      // вода → пар (кипение и медленное испарение в сухой воздух)
      if (water[i] > 0.5) {
        if (temp[i] > 100) {
          const heat = (temp[i] - 100) * water[i] * C_WATER;
          const ev = Math.min(water[i], heat / L_VAPOR) * rate;
          water[i] -= ev; steam[i] += ev;
          temp[i] -= ev * L_VAPOR / (water[i] * C_WATER + ev * C_GAS + 1);
        } else if (temp[i] > 15 && steam[i] < 0.4) {
          const ev = Math.min(water[i], 0.02 * rate);
          water[i] -= ev; steam[i] += ev; temp[i] -= 0.02 * rate;
        }
      }
      // пар → вода
      if (steam[i] > 1e-4 && temp[i] < 97) {
        const cond = steam[i] * Math.min(0.5, (97 - temp[i]) * 0.02 * rate);
        steam[i] -= cond; water[i] += cond;
        temp[i] += cond * L_VAPOR / (water[i] * C_WATER + 1) * 0.02;
      }
      if (water[i] < 0.01) water[i] = 0;
    }
  }
}

// ---------------------------------------------------------------- микробы
/** Микробы живут в грязной воде и слизи, гибнут в чистом кислороде и на морозе. */
function stepGerms(world, dt) {
  const { germs, water, pwater, temp, o2, mat } = world;
  const k = Math.min(0.3, 0.12 * dt * 60);
  for (let y = 1; y < H - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      const i = y * W + x;
      let g = germs[i];
      if (mat[i] === 9) { germs[i] = Math.max(g, 120); continue; }   // слизь — источник
      if (g <= 0.01) { germs[i] = 0; continue; }
      // среда
      let decay = 0.03;                       // базовое отмирание
      if (water[i] > 20 && pwater[i] > 0.4) decay = -0.01;           // грязная вода — рассадник
      else if (o2[i] > 0.4) decay = 0.09;                            // чистый кислород убивает
      if (temp[i] < -2 || temp[i] > 60) decay += 0.3;                // мороз и жар
      g *= Math.max(0, 1 - decay * dt);
      // расползание по воздуху и воде
      for (const n of [i - 1, i + 1, i - W, i + W]) {
        if (world.gasBlocked(n)) continue;
        const d = (g - germs[n]) * k * 0.12;
        if (d > 0) { g -= d; germs[n] += d; }
      }
      germs[i] = g < 0.01 ? 0 : g;
    }
  }
}

// ------------------------------------------------------------------ тепло
function stepHeat(world, dt) {
  const { temp, mat, water } = world;
  const k = Math.min(0.25, HEAT_K * dt * 60);
  const cap = i => mat[i] ? C_SOLID * 20 : (water[i] * C_WATER * 0.02 + totalGas(world, i) * C_GAS + 0.4);
  const pair = (a, b) => {
    const ca = cap(a), cb = cap(b);
    const d = (temp[a] - temp[b]) * k * (ca * cb) / ((ca + cb) * Math.max(ca, cb)) * 2;
    temp[a] -= d * cb / (ca + cb) * 2 * 0.5;
    temp[b] += d * ca / (ca + cb) * 2 * 0.5;
  };
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 2; x++) { const i = y * W + x; pair(i, i + 1); }
  for (let y = 1; y < H - 2; y++) for (let x = 1; x < W - 1; x++) { const i = y * W + x; pair(i, i + W); }
}

/** Освещение: солнце сверху + лампы. */
function stepLight(world) {
  const { light, mat, bdata } = world;
  light.fill(0);
  for (let x = 1; x < W - 1; x++) {
    let l = 1;
    for (let y = 1; y < H - 1; y++) {
      const i = y * W + x;
      light[i] = Math.max(light[i], l);
      if (mat[i]) l = 0; else l *= world.water[i] > 100 ? 0.94 : 0.985;
      if (l < 0.02) break;
    }
  }
  for (const [i, st] of bdata) {
    if (!st.built || !st.def.light || !st.powered) continue;
    const r = st.def.light, bx = i % W, by = (i / W) | 0;
    for (let y = by - r; y <= by + r; y++)
      for (let x = bx - r; x <= bx + r; x++) {
        if (x < 1 || y < 1 || x >= W - 1 || y >= H - 1) continue;
        const d = Math.hypot(x - bx, y - by);
        if (d > r) continue;
        const j = y * W + x;
        light[j] = Math.min(1, light[j] + (1 - d / r) * 0.9);
      }
  }
}

// ===== path.js =====================================================
// A* по тайлам: ходьба по полу, лазание по лестницам, падения.

class Heap {
  constructor() { this.a = []; }
  get size() { return this.a.length; }
  push(node, f) {
    this.a.push({ node, f });
    let i = this.a.length - 1;
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (this.a[p].f <= this.a[i].f) break;
      [this.a[p], this.a[i]] = [this.a[i], this.a[p]]; i = p;
    }
  }
  pop() {
    const top = this.a[0], last = this.a.pop();
    if (this.a.length) {
      this.a[0] = last;
      let i = 0;
      for (;;) {
        const l = i * 2 + 1, r = l + 1; let m = i;
        if (l < this.a.length && this.a[l].f < this.a[m].f) m = l;
        if (r < this.a.length && this.a[r].f < this.a[m].f) m = r;
        if (m === i) break;
        [this.a[m], this.a[i]] = [this.a[i], this.a[m]]; i = m;
      }
    }
    return top.node;
  }
}

/** Куда можно шагнуть из (x,y). cb(nx, ny, cost). */
function neighbors(world, x, y, cb) {
  const onFoot = world.standable(x, y) || world.climbable(x, y);
  if (onFoot) {
    for (const dx of [-1, 1]) {
      const nx = x + dx;
      if (world.solid(nx, y)) continue;
      if (world.standable(nx, y) || world.climbable(nx, y)) { cb(nx, y, 1); continue; }
      // подъём на ступеньку в один тайл — как дупликанты в ONI
      if (world.solid(nx, y) && !world.solid(nx, y - 1) && !world.solid(x, y - 1)
          && (world.standable(nx, y - 1) || world.climbable(nx, y - 1))) { cb(nx, y - 1, 1.4); continue; }
      if (world.solid(nx, y)) continue;
      // шаг в пустоту: падаем, если внизу есть куда приземлиться
      let fy = y;
      while (fy - y < 8 && !world.solid(nx, fy + 1) && !world.standable(nx, fy + 1)) fy++;
      if (!world.solid(nx, fy + 1) || world.standable(nx, fy + 1)) {
        if (world.standable(nx, fy + 1)) cb(nx, fy + 1, 1 + (fy - y) * 0.6);
      }
    }
  }
  if (world.climbable(x, y) && !world.solid(x, y - 1)) cb(x, y - 1, 1.3);
  if (!world.solid(x, y + 1) && (world.climbable(x, y + 1) || world.standable(x, y + 1))) cb(x, y + 1, 1.1);
}

/**
 * Путь от (sx,sy) до любой из целевых клеток.
 * goals — Set индексов. Возвращает массив [{x,y}, ...] или null.
 */
function findPath(world, sx, sy, goals, limit = 7000) {
  if (!goals || !goals.size) return null;
  const start = sy * W + sx;
  if (goals.has(start)) return [];
  const came = new Map(), g = new Map();
  const open = new Heap();
  // эвристика — до ближайшей цели
  let gx = 0, gy = 0, best = Infinity;
  for (const gi of goals) {
    const x = gi % W, y = (gi / W) | 0;
    const d = Math.abs(x - sx) + Math.abs(y - sy);
    if (d < best) { best = d; gx = x; gy = y; }
  }
  const h = (x, y) => Math.abs(x - gx) + Math.abs(y - gy);
  g.set(start, 0);
  open.push(start, h(sx, sy));
  let visited = 0;

  while (open.size) {
    const cur = open.pop();
    if (goals.has(cur)) {
      const path = [];
      let c = cur;
      while (c !== start) { path.push({ x: c % W, y: (c / W) | 0 }); c = came.get(c); }
      return path.reverse();
    }
    if (++visited > limit) break;
    const cx = cur % W, cy = (cur / W) | 0, cg = g.get(cur);
    neighbors(world, cx, cy, (nx, ny, cost) => {
      const ni = ny * W + nx;
      const ng = cg + cost;
      if (g.has(ni) && g.get(ni) <= ng) return;
      g.set(ni, ng); came.set(ni, cur);
      open.push(ni, ng + h(nx, ny));
    });
  }
  return null;
}

/** Клетки, из которых можно взаимодействовать с (x,y). */
function accessCells(world, x, y, includeSelf = true) {
  const out = new Set();
  const add = (ax, ay) => {
    if (!world.inside(ax, ay)) return;
    if (world.standable(ax, ay) || world.climbable(ax, ay)) out.add(ay * W + ax);
  };
  if (includeSelf) add(x, y);
  add(x - 1, y); add(x + 1, y); add(x, y - 1); add(x, y + 1);
  add(x - 1, y - 1); add(x + 1, y - 1); add(x - 1, y + 1); add(x + 1, y + 1);
  return out;
}

// Растения: у каждого свои требования к среде. Не выполнены — рост стоит.
const PLANTS = {

    needs: { dirt: 0.02 }, temp: [5, 35], light: null, water: 0,
    hint: 'грунт, 5…35 °C',
  },
  bristle: {
    name: 'Щетинистая почка', icon: '🌼', yield: 'food', amount: 34, time: 200,
    needs: { dirt: 0.01 }, temp: [5, 30], light: 0.45, water: 0.6,
    hint: 'свет, вода, 5…30 °C',
  },
  mushroom: {
    name: 'Пузырчатый гриб', icon: '🍄', yield: 'food', amount: 26, time: 240,
    needs: { slime: 0.03 }, temp: [10, 45], light: -0.2, water: 0,
    hint: 'слизь, темнота',
  },

    name: 'Морозная пшеница', icon: '❄️', yield: 'food', amount: 30, time: 300,
    needs: { dirt: 0.01 }, temp: [-30, 5], light: null, water: 0.3,
    hint: 'холод ниже 5 °C',
  },
};

/** Подобрать культуру под условия тайла. */
function chooseCrop(world, i) {
  const t = world.temp[i], l = world.light[i];
  let best = 'mealwood', score = -1;
  for (const [key, p] of Object.entries(PLANTS)) {
    let s = 0;
    if (t < p.temp[0] || t > p.temp[1]) continue;
    s += 1;
    if (p.light !== null) s += p.light > 0 ? (l >= p.light ? 1 : -1) : (l < 0.25 ? 1 : -1);
    s += p.amount / 40;
    if (s > score) { score = s; best = key; }
  }
  return best;
}

/** Проверка условий роста. Возвращает {ok, reason}. */
function checkPlant(world, st, i) {
  const p = PLANTS[st.plant];
  if (!p) return { ok: false, reason: 'нет культуры' };
  const t = world.temp[i];
  if (t < p.temp[0]) return { ok: false, reason: 'холодно' };
  if (t > p.temp[1]) return { ok: false, reason: 'жарко' };
  if (p.light !== null) {
    if (p.light > 0 && world.light[i] < p.light) return { ok: false, reason: 'мало света' };
    if (p.light < 0 && world.light[i] > 0.25) return { ok: false, reason: 'слишком светло' };
  }
  if (p.water > 0 && (st.store.water || 0) <= 0) return { ok: false, reason: 'нужна вода' };
  const [res, rate] = Object.entries(p.needs)[0];
  if ((st.store[res] || 0) <= 0) return { ok: false, reason: `нужен ресурс: ${res}` };
  return { ok: true, res, rate, plant: p };
}

// ===== jobs.js =====================================================
// Биржа работ: приказы копать/строить/таскать/собирать урожай/крутить генератор.



const PLANT_NEEDS = Object.fromEntries(Object.entries(PLANTS).map(([k, p]) => [k, p.needs]));
const PLANT_WATER = Object.fromEntries(Object.entries(PLANTS).map(([k, p]) => [k, p.water > 0]));

const JOB_ORDER = ['operate', 'hunt', 'cook', 'research', 'supply', 'build', 'dig', 'harvest', 'deconstruct', 'haul'];

/** Нужен ли оператор станку (кухня, лаборатория). */
function needsOperator(st, game) {
  if (st.def.manualWork === 'cook') return (st.store.food || 0) >= 5 && (st.store.meal || 0) < 40;
  if (st.def.manualWork === 'research') return !!game.research && !!game.research.current;
  return false;
}
const JOB_LABEL = {
  operate: 'Генератор', supply: 'Подвоз', build: 'Стройка', dig: 'Копает',
  harvest: 'Урожай', deconstruct: 'Разбор', haul: 'Переноска',
  hunt: 'Охотится', eat: 'Ест', sleep: 'Спит', breathe: 'Задыхается', idle: 'Без дела', walk: 'Идёт',
  cook: 'Готовит', research: 'Изучает', toilet: 'В уборной', wash: 'Моется', heal: 'Лечится', fun: 'Отдыхает',
};

class JobBoard {
  constructor() { this.jobs = []; this.claimed = new Map(); this.bad = new Map(); }

  /** Временно отложить невыполнимую задачу, чтобы не зацикливаться на ней. */
  postpone(job, until) { if (job) this.bad.set(job.key, until); }

  clearClaims(pawn) {
    for (const [job, owner] of this.claimed) if (owner === pawn) this.claimed.delete(job);
  }

  rebuild(world, game) {
    const jobs = [];
    const { mat, dig, bdata, items } = world;

    // 1. добыча
    for (let i = 0; i < dig.length; i++) {
      if (dig[i] && mat[i]) jobs.push({ type: 'dig', x: i % W, y: (i / W) | 0, key: 'dig' + i });
    }

    // 2. стройплощадки: подвоз материалов, затем работа
    for (const [k, st] of bdata) {
      const x = st.x, y = st.y;
      if (st.remove) { jobs.push({ type: 'deconstruct', x, y, k, key: 'dec' + k }); continue; }
      if (st.built) {
        if (st.def.farm && st.growth >= 1) jobs.push({ type: 'harvest', x, y, k, key: 'hv' + k });
        if (st.def.uses && (st.store[st.def.uses] || 0) < 20)
          jobs.push({ type: 'supply', x, y, k, res: st.def.uses, amount: 20, key: 'sup' + k });
        if (st.def.farm) {
          const want = st.plant ? Object.keys(PLANT_NEEDS[st.plant] || { dirt: 1 })[0] : 'dirt';
          if ((st.store[want] || 0) < 10) jobs.push({ type: 'supply', x, y, k, res: want, amount: 10, key: 'farm' + k });
          if (st.plant && PLANT_WATER[st.plant] && (st.store.water || 0) < 5 && st.net?.liquid === -1)
            jobs.push({ type: 'supply', x, y, k, res: 'ice', amount: 10, key: 'fw' + k });
        }
        if (st.def.manual && game.power.deficit > 0)
          jobs.push({ type: 'operate', x, y, k, key: 'op' + k });
        if (st.def.manualWork === 'cook' && (st.store.food || 0) < 40)
          jobs.push({ type: 'supply', x, y, k, res: 'food', amount: 40, key: 'sfood' + k });
        if (st.def.manualWork && st.powered !== false && needsOperator(st, game))
          jobs.push({ type: st.def.manualWork, x, y, k, key: 'mw' + k });
        continue;
      }
      let missing = null;
      for (const [res, amt] of Object.entries(st.def.cost)) {
        const have = st.delivered?.[res] || 0;
        if (have < amt) { missing = { res, amount: amt - have }; break; }
      }
      if (missing) jobs.push({ type: 'supply', x, y, k, res: missing.res, amount: missing.amount, key: 'sup' + k, site: true });
      else jobs.push({ type: 'build', x, y, k, key: 'bld' + k });
    }

    // 2.5 охота
    for (const c of game.critters || []) {
      if (c.hunted && !c.dead) jobs.push({ type: 'hunt', x: c.x, y: c.y, cid: c.id, key: 'hunt' + c.id });
    }

    // 3. переноска: кучи на полу → склад
    for (const [i, pile] of items) {
      const x = i % W, y = (i / W) | 0;
      for (const [res, amt] of Object.entries(pile)) {
        if (amt < 0.5) continue;
        jobs.push({ type: 'haul', x, y, res, amount: amt, key: 'h' + i + res });
      }
    }

    this.jobs = jobs;
    const live = new Set(jobs.map(j => j.key));
    for (const key of [...this.claimed.keys()]) if (!live.has(key)) this.claimed.delete(key);
  }

  /** Подобрать задачу для дупликанта: ближайшая доступная с учётом приоритетов. */
  assign(world, pawn, game) {
    const cands = this.jobs
      .filter(j => {
        const owner = this.claimed.get(j.key);
        if (owner && owner !== pawn) return false;
        const bad = this.bad.get(j.key);
        if (bad !== undefined) { if (bad > game.time) return false; this.bad.delete(j.key); }
        if (pawn.prioOf(j.type) <= 0) return false;
        if (!stillValid(world, j)) return false;
        if (j.type === 'haul' && !storageFor(world, j.res)) return false;
        if ((j.type === 'supply' || j.type === 'build') && !supplyReady(world, j)) return false;
        return true;
      })
      .map(j => ({
        j,
        rank: JOB_ORDER.indexOf(j.type) - pawn.prioOf(j.type) * 3,
        d: Math.abs(j.x - pawn.x) + Math.abs(j.y - pawn.y),
      }))
      .sort((a, b) => (a.rank - b.rank) || (a.d - b.d))
      .slice(0, 14);

    for (const { j } of cands) {
      const goals = accessCells(world, j.x, j.y, j.type !== 'dig');
      const path = findPath(world, pawn.x, pawn.y, goals);
      if (!path) continue;
      this.claimed.set(j.key, pawn);
      return { job: j, path };
    }
    return null;
  }
}

/** Проверка задачи по актуальному состоянию мира (список работ обновляется не каждый кадр). */
function stillValid(world, j) {
  const i = j.y * W + j.x;
  const st = j.k !== undefined ? world.bdata.get(j.k) : null;
  switch (j.type) {
    case 'dig': return !!world.mat[i] && !!world.dig[i];
    case 'haul': return (world.items.get(i)?.[j.res] || 0) > 0.4;
    case 'build': return !!st && !st.built && !st.remove;
    case 'deconstruct': return !!st && !!st.remove;
    case 'harvest': return !!st && st.built && st.growth >= 1;
    case 'operate': return !!st && st.built;
    case 'cook': return !!st && st.built && (st.store.food || 0) >= 5;
    case 'research': return !!st && st.built;
    case 'supply': {
      if (!st) return false;
      if (!st.built) {
        if (j.site === undefined && !st.def.uses && !st.def.farm) return false;
        const need = st.def.cost[j.res] || 0;
        return (st.delivered?.[j.res] || 0) + 0.01 < need;
      }
      if (st.def.uses === j.res) return (st.store[j.res] || 0) < 20;
      if (st.def.manualWork === 'cook' && j.res === 'food') return (st.store.food || 0) < 40;
      if (st.def.farm) return (st.store[j.res] || 0) < 10;
      return false;
    }
    case 'hunt': return true;
    default: return true;
  }
}

/** Есть ли где хранить ресурс. */
function storageFor(world, res) {
  const kind = storageKind(res);
  for (const [i, st] of world.bdata) {
    if (!st.built || st.def.store !== kind) continue;
    const used = Object.values(st.store).reduce((a, b) => a + b, 0);
    if (used < st.def.cap) return st;
  }
  return null;
}

/** Есть ли откуда взять ресурс для подвоза. */
function supplyReady(world, job) {
  if (job.type === 'build') return true;
  return !!findResource(world, job.res);
}

function storageKind(res) { return res === 'food' || res === 'meal' ? 'food' : 'mat'; }

/** Источники ресурса, отсортированные по удалённости: склады и кучи на полу. */
function findResources(world, res, near, limit = 8) {
  const out = [];
  for (const [, st] of world.bdata) {
    if (!st.built || !st.store[res] || st.store[res] < 0.5) continue;
    out.push({ x: st.x, y: st.y, from: st });
  }
  for (const [i, pile] of world.items) {
    if (!pile[res] || pile[res] < 0.5) continue;
    out.push({ x: i % W, y: (i / W) | 0, pileIdx: i });
  }
  if (near) out.sort((a, b) =>
    (Math.abs(a.x - near.x) + Math.abs(a.y - near.y)) - (Math.abs(b.x - near.x) + Math.abs(b.y - near.y)));
  return out.slice(0, limit);
}

/** Ближайший источник ресурса (без проверки достижимости). */
function findResource(world, res, near) {
  return findResources(world, res, near, 1)[0] || null;
}

/** Ближайший достижимый источник — с проверкой пути. */
function reachableResource(world, res, pawn) {
  for (const src of findResources(world, res, pawn)) {
    const path = findPath(world, pawn.x, pawn.y, accessCells(world, src.x, src.y));
    if (path) return { src, path };
  }
  return null;
}

/** Ближайший достижимый склад для ресурса. */
function reachableStorage(world, res, pawn) {
  const kind = res === 'food' || res === 'meal' ? 'food' : 'mat';
  const bins = [];
  for (const [, st] of world.bdata) {
    if (!st.built || st.def.store !== kind) continue;
    const used = Object.values(st.store).reduce((a, b) => a + b, 0);
    if (used < st.def.cap) bins.push(st);
  }
  bins.sort((a, b) => (Math.abs(a.x - pawn.x) + Math.abs(a.y - pawn.y)) - (Math.abs(b.x - pawn.x) + Math.abs(b.y - pawn.y)));
  for (const bin of bins.slice(0, 6)) {
    const path = findPath(world, pawn.x, pawn.y, accessCells(world, bin.x, bin.y));
    if (path) return { bin, path };
  }
  return null;
}

/** Сколько всего ресурса на складах и на полу. */
function countResource(world, res) {
  let n = 0;
  for (const [, st] of world.bdata) if (st.built && st.store[res]) n += st.store[res];
  for (const [, pile] of world.items) if (pile[res]) n += pile[res];
  return n;
}

function buildingCostText(def) {
  return Object.entries(def.cost).map(([r, a]) => `${a} ${r}`).join(', ');
}

// ===== network.js ==================================================
// Сети: электропроводка, трубы для жидкости и газа.
// Каждая сеть — связная группа проводов/труб; машины подключаются
// через собственный тайл или соседний по стороне.

const KINDS = ['power', 'liquid', 'gas', 'auto'];

class Networks {
  constructor() {
    this.map = {};
    this.nets = {};
    for (const k of KINDS) { this.map[k] = new Int32Array(W * H).fill(-1); this.nets[k] = []; }
  }

  rebuild(world) {
    for (const k of KINDS) { this.map[k].fill(-1); this.nets[k] = []; }
    const stack = [];
    for (const [, st] of world.bdata) {
      if (!st.built || !st.def.conduit) continue;
      const kind = st.def.conduit;
      const i = st.y * W + st.x;
      if (this.map[kind][i] >= 0) continue;
      const net = this.newNet(kind);
      const id = this.nets[kind].length - 1;
      stack.length = 0; stack.push(i);
      this.map[kind][i] = id;
      while (stack.length) {
        const c = stack.pop();
        net.tiles++;
        const x = c % W, y = (c / W) | 0;
        for (const n of [c - 1, c + 1, c - W, c + W]) {
          if (n < 0 || n >= W * H) continue;
          if (Math.abs((n % W) - x) > 1) continue;
          if (this.map[kind][n] >= 0) continue;
          if (!world.cond[kind][n]) continue;
          const s2 = world.bdata.get(n * 8 + LAYER[kind]);
          if (!s2 || !s2.built) continue;
          this.map[kind][n] = id; stack.push(n);
        }
      }
      net.cap = net.tiles * (kind === 'liquid' ? 10 : kind === 'gas' ? 1 : 0);
      net.wattCap = kind === 'power' ? 1000 : 0;   // предел обычного провода
    }

    // подключение машин
    for (const [, st] of world.bdata) {
      st.net = { power: -1, liquid: -1, gas: -1, auto: -1 };
      if (!st.built || !st.def.net) continue;
      const i = st.y * W + st.x;
      for (const kind of KINDS) {
        if (!st.def.net[kind]) continue;
        for (const n of [i, i - 1, i + 1, i - W, i + W]) {
          if (n < 0 || n >= W * H) continue;
          const id = this.map[kind][n];
          if (id >= 0) { st.net[kind] = id; this.nets[kind][id].machines.push(st); break; }
        }
      }
    }
    world.netDirty = false;
  }

  newNet(kind) {
    const net = { kind, tiles: 0, cap: 0, machines: [], gen: 0, demand: 0, consumed: 0, stored: 0, storeCap: 0, buffer: {} };
    this.nets[kind].push(net);
    return net;
  }

  net(kind, id) { return id >= 0 ? this.nets[kind][id] : null; }

  /** Жидкость/газ в сети: сколько всего килограммов. */
  static amount(net) {
    if (!net) return 0;
    let s = 0;
    for (const v of Object.values(net.buffer)) s += v;
    return s;
  }

  /** Добавить вещество в сеть, вернуть, сколько влезло. */
  static push(net, res, amt) {
    if (!net || amt <= 0) return 0;
    const room = net.cap - Networks.amount(net);
    const put = Math.min(room, amt);
    if (put <= 0) return 0;
    net.buffer[res] = (net.buffer[res] || 0) + put;
    return put;
  }

  /** Забрать вещество (или любое, если res === null). */
  static pull(net, res, amt) {
    if (!net || amt <= 0) return null;
    if (res) {
      const have = net.buffer[res] || 0;
      const got = Math.min(have, amt);
      if (got <= 0) return null;
      net.buffer[res] -= got;
      return { res, amt: got };
    }
    for (const [k, v] of Object.entries(net.buffer)) {
      if (v <= 0) continue;
      const got = Math.min(v, amt);
      net.buffer[k] -= got;
      return { res: k, amt: got };
    }
    return null;
  }
}

// ===== machines.js =================================================
// Поведение машин: энергия по сетям, насосы, электролиз, очистка, генераторы.



const GAS_KEYS = ['o2', 'co2', 'steam', 'h2'];

/** Энергия считается отдельно для каждой электросети. */
function updatePower(world, nets, dt, totals) {
  totals.gen = 0; totals.demand = 0; totals.stored = 0; totals.cap = 0; totals.deficit = 0;

  // машины без сети остаются обесточенными
  for (const [, st] of world.bdata) if (st.built && st.def.power < 0) st.powered = false;
  if (world.netDirty) return;

  for (const net of nets.nets.power) {
    let gen = 0, demand = 0, stored = 0, cap = 0;
    const consumers = [], batteries = [];
    for (const st of net.machines) {
      const d = st.def;
      if (d.storeJ) { batteries.push(st); stored += st.charge; cap += d.storeJ; }
      if (d.power > 0) {
        if (d.manual) {
          st.operating = Math.max(0, (st.operating || 0) - dt);
          if (st.operating > 0) gen += d.power;
        } else if (d.uses) {
          const fuel = st.store[d.uses] || 0;
          st.burning = fuel > 0;
          if (st.burning) { st.store[d.uses] = Math.max(0, fuel - 0.12 * dt); gen += d.power; }
        } else gen += d.power;
      } else if (d.power < 0) { demand += -d.power; consumers.push(st); }
    }
    const fromBatteries = dt > 0 ? stored / dt : 0;
    let budget = gen + fromBatteries, consumed = 0;
    for (const st of consumers) {
      const p = -st.def.power;
      if (budget >= p) { st.powered = true; budget -= p; consumed += p; } else st.powered = false;
    }
    let rest = Math.abs((gen - consumed) * dt);
    const charging = gen >= consumed;
    for (const st of batteries) {
      if (rest <= 0) break;
      if (charging) { const put = Math.min(st.def.storeJ - st.charge, rest); st.charge += put; rest -= put; }
      else { const take = Math.min(st.charge, rest); st.charge -= take; rest -= take; }
    }
    // перегрузка: если сеть тянет больше предела, провод перегорает
    if (net.wattCap && consumed > net.wattCap) {
      net.overload = (net.overload || 0) + dt;
      if (net.overload > 4) {
        net.overload = 0;
        const wires = [];
        for (let i = 0; i < world.cond.power.length; i++) if (nets.map.power[i] === nets.nets.power.indexOf(net)) wires.push(i);
        const victim = wires[Math.floor(Math.random() * wires.length)];
        if (victim !== undefined) {
          world.removeBuilding(victim % W, (victim / W) | 0, 1);
          totals.burned = (totals.burned || 0) + 1;
        }
      }
    } else net.overload = 0;

    net.gen = gen; net.demand = demand; net.consumed = consumed;
    net.stored = batteries.reduce((a, b) => a + b.charge, 0); net.storeCap = cap;
    totals.gen += gen; totals.demand += demand; totals.stored += net.stored; totals.cap += cap;
    if (demand > gen && net.stored <= 0) totals.deficit += demand - gen;
  }
}

/** Датчики и логические сети: сигнал включает/выключает машины. */
function updateAutomation(world, nets, dt) {
  for (const net of nets.nets.auto) net.signal = false;
  for (const [, st] of world.bdata) {
    if (!st.built || !st.def.sensor) continue;
    const i = st.y * W + st.x;
    const d = st.def;
    let v = 0;
    if (d.sensor === 'temp') v = world.temp[i];
    else if (d.sensor === 'gas') v = world.o2[i] + world.co2[i] + world.steam[i] + world.h2[i];
    else if (d.sensor === 'water') v = world.water[i];
    const thr = st.threshold ?? d.threshold;
    const above = st.above ?? d.above;
    st.signal = d.sensor === 'manual' ? (st.on !== false) : (above ? v > thr : v < thr);
    const net = nets.net('auto', st.net?.auto ?? -1);
    if (net && st.signal) net.signal = true;
  }
  for (const [, st] of world.bdata) {
    if (!st.built || !st.def.auto) continue;
    const id = st.net?.auto ?? -1;
    st.autoOff = id >= 0 && !nets.net('auto', id).signal;
  }
}

/** Работа устройств: газ, вода, тепло, топливо. */
function updateMachines(world, nets, game, dt) {
  for (const [, st] of world.bdata) {
    if (!st.built) continue;
    const d = st.def, x = st.x, y = st.y, i = y * W + x;
    if (st.autoOff) { if (d.power < 0) st.powered = false; continue; }
    const liq = nets.net('liquid', st.net?.liquid ?? -1);
    const gas = nets.net('gas', st.net?.gas ?? -1);

    switch (d.key) {
      case 'diffuser': {
        if (!st.powered) break;
        const use = 0.06 * dt;
        if ((st.store.algae || 0) > use) {
          st.store.algae -= use;
          world.o2[i] += use * 12;
          world.temp[i] += 0.4 * dt;
        }
        break;
      }
      case 'skimmer': {
        if (!st.powered) break;
        const got = liq ? Networks.pull(liq, 'water', 0.03 * dt) : null;
        if (!got && liq) break;
        for (const j of [i, i - 1, i + 1, i - W, i + W]) {
          if (j < 0 || j >= world.co2.length || world.gasBlocked(j)) continue;
          world.co2[j] = Math.max(0, world.co2[j] - 0.05 * dt);
        }
        if (got) { world.water[i] += got.amt; world.pwater[i] = 1; }
        world.temp[i] += 0.3 * dt;
        break;
      }
      case 'coalgen': {
        if (st.burning) { world.co2[i] += 0.02 * dt; world.temp[i] += 2.5 * dt; }
        break;
      }
      case 'lpump': {
        if (!st.powered || !liq) break;
        const src = [i, i + W].find(j => world.water[j] > 1);
        if (src === undefined) break;
        const take = Math.min(world.water[src], 10 * dt);
        const dirty = world.pwater[src] > 0.4;
        const moved = Networks.push(liq, dirty ? 'pwater' : 'water', take);
        world.water[src] -= moved;
        if (world.water[src] < 0.01) { world.water[src] = 0; world.pwater[src] = 0; }
        break;
      }
      case 'lvent': {
        if (!liq) break;
        const got = Networks.pull(liq, null, 10 * dt);
        if (!got) break;
        world.water[i] += got.amt;
        if (got.res === 'pwater') world.pwater[i] = Math.min(1, world.pwater[i] + got.amt / LIQ_FULL);
        break;
      }
      case 'gpump': {
        if (!st.powered || !gas) break;
        for (const g of GAS_KEYS) {
          if (world[g][i] <= 0.005) continue;
          const take = Math.min(world[g][i], 0.5 * dt);
          const moved = Networks.push(gas, g, take);
          world[g][i] -= moved;
        }
        break;
      }
      case 'gvent': {
        if (!gas) break;
        const got = Networks.pull(gas, null, 0.5 * dt);
        if (got) world[got.res][i] += got.amt;
        break;
      }
      case 'electro': {
        if (!st.powered || !liq) break;
        const got = Networks.pull(liq, 'water', 1.0 * dt);
        if (!got) break;
        world.o2[i] += got.amt * 0.888;
        world.h2[i] += got.amt * 0.112;
        world.temp[i] += 1.5 * dt;
        break;
      }
      case 'sieve': {
        if (!st.powered || !liq) break;
        if ((st.store.stone || 0) < 0.02) break;
        const got = Networks.pull(liq, 'pwater', 5 * dt);
        if (!got) break;
        st.store.stone -= got.amt * 0.004;
        Networks.push(liq, 'water', got.amt);
        world.temp[i] += 0.1 * dt;
        break;
      }
      case 'compost': {
        const have = st.store.pdirt || 0;
        if (have <= 0) break;
        const conv = Math.min(have, 0.05 * dt);
        st.store.pdirt -= conv;
        st.store.dirt = (st.store.dirt || 0) + conv;
        world.temp[i] += 0.2 * dt;
        if ((st.store.dirt || 0) > 25) { world.addItem(x, y, 'dirt', st.store.dirt); st.store.dirt = 0; }
        break;
      }
      case 'suitdock': {
        // док набирает кислород из газовой сети или из воздуха вокруг
        if (!st.powered) break;
        const want = 40 - (st.store.o2 || 0);
        if (want > 0) {
          const got = gas ? Networks.pull(gas, 'o2', 1 * dt) : null;
          if (got) st.store.o2 = (st.store.o2 || 0) + got.amt;
          else if (world.o2[i] > 0.4) {
            const take = Math.min(world.o2[i] - 0.4, 0.5 * dt);
            world.o2[i] -= take; st.store.o2 = (st.store.o2 || 0) + take;
          }
        }
        break;
      }
      case 'ration': {
        st.chilled = st.powered;
        break;
      }
      case 'shower': case 'basin': {
        if (d.net?.liquid && liq && (st.store.water || 0) < 20) {
          const got = Networks.pull(liq, 'water', 5 * dt);
          if (got) st.store.water = (st.store.water || 0) + got.amt;
        }
        break;
      }
    }

    if (d.light) st.lit = st.powered;
  }
}

// Психология и социум: мнения друг о друге, разговоры, ссоры, воспоминания.
const CHAT_RANGE = 3;

const THOUGHTS = {
  chat:       { text: 'Приятная беседа',      value: +6,  dur: 240 },
  argue:      { text: 'Поссорился',           value: -10, dur: 300 },
  friendDied: { text: 'Погиб друг',           value: -30, dur: 900 },
  ateGood:    { text: 'Вкусно поел',          value: +8,  dur: 200 },
  ateSame:    { text: 'Надоела одна и та же еда', value: -6, dur: 300 },
  slept:      { text: 'Выспался',             value: +6,  dur: 200 },
  sleptFloor: { text: 'Спал на полу',         value: -8,  dur: 300 },
  newTech:    { text: 'Прорыв в науке',       value: +6,  dur: 300 },
  scalded:    { text: 'Ошпарился',            value: -12, dur: 240 },
  fell:       { text: 'Больно упал',          value: -8,  dur: 200 },
};

/** Разговоры и отношения: раз в несколько секунд ищем соседей. */
function stepSocial(game, dt) {
  const pawns = game.pawns;
  for (let a = 0; a < pawns.length; a++) {
    for (let b = a + 1; b < pawns.length; b++) {
      const p = pawns[a], q = pawns[b];
      if (Math.abs(p.x - q.x) + Math.abs(p.y - q.y) > CHAT_RANGE) continue;
      if (p.task === 'sleep' || q.task === 'sleep') continue;
      if (Math.random() > 0.35 * dt) continue;

      const chemistry = (p.mood + q.mood) / 2 - 45 + (p.opinion(q) + q.opinion(p)) / 4;
      const good = chemistry + (Math.random() - 0.5) * 40 > 0;
      const delta = good ? 4 + Math.random() * 4 : -(4 + Math.random() * 6);
      p.addOpinion(q, delta); q.addOpinion(p, delta);
      p.remember(good ? 'chat' : 'argue'); q.remember(good ? 'chat' : 'argue');
      if (!good && Math.abs(delta) > 8) {
        p.stress = Math.min(100, p.stress + 6);
        q.stress = Math.min(100, q.stress + 6);
      }
    }
  }
}

function relationLabel(v) {
  if (v > 60) return 'лучший друг';
  if (v > 25) return 'друг';
  if (v > -10) return 'знакомый';
  if (v > -45) return 'неприязнь';
  return 'враг';
}
