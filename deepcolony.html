        if (frac > 0) { ctx.fillStyle = 'rgba(255,180,60,.6)'; ctx.fillRect(px + 2, py + TILE - 4, (TILE - 4) * frac, 2); }
        ctx.globalAlpha = 0.5;
        this.icon(ctx, def, px, py, st);
        ctx.globalAlpha = 1;
        continue;
      }
      if (st.remove) { ctx.fillStyle = 'rgba(255,80,70,.25)'; ctx.fillRect(px, py, TILE, TILE); }
      this.icon(ctx, def, px, py, st);
    }
  }

  icon(ctx, def, px, py, st) {
    if (def.key === 'tile') {
      // кирпичная кладка со смещением рядов
      const tex = this.tex.tile(2, ((px + py) / TILE) & 3);
      if (tex) ctx.drawImage(tex, px, py, TILE, TILE);
      ctx.fillStyle = 'rgba(255,240,215,.18)'; ctx.fillRect(px, py, TILE, 2);
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(px, py + TILE - 2, TILE, 2);
      ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1;
      const row = ((py / TILE) | 0) % 2;
      ctx.beginPath();
      ctx.moveTo(px, py + TILE / 2); ctx.lineTo(px + TILE, py + TILE / 2);
      ctx.moveTo(px + (row ? TILE / 2 : 0), py); ctx.lineTo(px + (row ? TILE / 2 : 0), py + TILE / 2);
      ctx.moveTo(px + (row ? 0 : TILE / 2), py + TILE / 2); ctx.lineTo(px + (row ? 0 : TILE / 2), py + TILE);
      ctx.stroke();
      return;
    }
    if (def.key === 'ladder') {
      ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(px + 4.6, py); ctx.lineTo(px + 4.6, py + TILE);
      ctx.moveTo(px + TILE - 3.4, py); ctx.lineTo(px + TILE - 3.4, py + TILE);
      ctx.stroke();
      ctx.strokeStyle = '#caa06a'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(px + 4, py); ctx.lineTo(px + 4, py + TILE);
      ctx.moveTo(px + TILE - 4, py); ctx.lineTo(px + TILE - 4, py + TILE);
      for (let k = 3; k < TILE; k += 5) { ctx.moveTo(px + 4, py + k); ctx.lineTo(px + TILE - 4, py + k); }
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,230,190,.45)'; ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(px + 3.3, py); ctx.lineTo(px + 3.3, py + TILE);
      ctx.stroke();
      return;
    }
    if (def.key === 'door') {
      ctx.fillStyle = '#6a7784';
      roundRect(ctx, px + 1, py + 1, TILE - 2, TILE - 2, 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(px + 2, py + 2, TILE - 4, 2);
      ctx.fillStyle = '#48535e'; ctx.fillRect(px + TILE / 2 - 1, py + 2, 2, TILE - 4);
      return;
    }

    // корпус прибора: металл с бликом и болтами
    const unpowered = def.power < 0 && st.powered === false;
    const g = ctx.createLinearGradient(0, py, 0, py + TILE);
    g.addColorStop(0, unpowered ? '#4b3f4d' : '#456a76');
    g.addColorStop(1, unpowered ? '#2c242f' : '#243d47');
    ctx.fillStyle = g;
    roundRect(ctx, px + 1, py + 2, TILE - 2, TILE - 3, 3);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    ctx.fillRect(px + 2, py + 3, TILE - 4, 1.4);
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    for (const [bx, by] of [[3, 4], [TILE - 3, 4], [3, TILE - 3], [TILE - 3, TILE - 3]]) {
      ctx.beginPath(); ctx.arc(px + bx, py + by, 0.7, 0, 7); ctx.fill();
    }

    ctx.font = `${TILE - 6}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(def.icon, px + TILE / 2, py + TILE / 2 + 1);

    if (def.farm && st.planted && st.plant) {
      ctx.font = `${TILE - 6}px serif`;
      ctx.fillText(PLANTS[st.plant]?.icon || '🌱', px + TILE / 2, py + TILE / 2 - 4);
      if (st.wilt) { ctx.fillStyle = '#ff6b5e'; ctx.beginPath(); ctx.arc(px + 3, py + 3, 1.8, 0, 7); ctx.fill(); }
    }
    if (def.farm && st.planted) {
      const gr = Math.min(1, st.growth);
      ctx.strokeStyle = '#8ada6a'; ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(px + TILE / 2, py + TILE - 2);
      ctx.lineTo(px + TILE / 2, py + TILE - 2 - gr * (TILE - 5));
      ctx.stroke();
      if (gr >= 1) { ctx.fillStyle = '#ffd35c'; ctx.beginPath(); ctx.arc(px + TILE / 2, py + 3, 2.4, 0, 7); ctx.fill(); }
    }
    if (unpowered) {
      ctx.fillStyle = '#ff6b5e';
      ctx.beginPath(); ctx.arc(px + TILE - 3, py + 3, 1.8, 0, 7); ctx.fill();
    } else if (def.power < 0 && st.powered) {
      ctx.fillStyle = '#7ed957';
      ctx.beginPath(); ctx.arc(px + TILE - 3, py + 3, 1.6, 0, 7); ctx.fill();
    }
  }

  // ------------------------------------------------------- ресурсы на полу
  drawItems(ctx, { x0, x1, y0, y1 }) {
    const w = this.world;
    for (const [i, pile] of w.items) {
      const x = i % W, y = (i / W) | 0;
      if (x < x0 || x > x1 || y < y0 || y > y1) continue;
      let k = 0;
      for (const [res, amt] of Object.entries(pile)) {
        if (amt < 0.2) continue;
        const px = x * TILE + 4 + (k % 2) * 7, py = y * TILE + TILE - 4 - ((k / 2) | 0) * 6;
        this.chunk(ctx, res, px, py, 1 + Math.min(1, amt / 40));
        k++;
        if (k > 3) break;
      }
    }
  }

  /** Кусок породы/ресурса: тень, тело, блик. */
  chunk(ctx, res, px, py, scale) {
    const [c1, c2] = RES_COLOR[res] || ['#9aa0a8', '#5f666e'];
    const r = 2.4 * scale;
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(px, py + 1.2, r * 1.15, r * 0.45, 0, 0, 7); ctx.fill();
    const g = ctx.createLinearGradient(0, py - r, 0, py + r);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(px - r, py);
    ctx.lineTo(px - r * 0.5, py - r);
    ctx.lineTo(px + r * 0.6, py - r * 0.85);
    ctx.lineTo(px + r, py + r * 0.2);
    ctx.lineTo(px, py + r * 0.6);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath();
    ctx.ellipse(px - r * 0.25, py - r * 0.45, r * 0.32, r * 0.18, -0.5, 0, 7);
    ctx.fill();
  }

  // --------------------------------------------------------------- приказы
  drawOrders(ctx, { x0, x1, y0, y1 }) {
    const w = this.world;
    ctx.lineWidth = 1.4;
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const i = y * W + x;
        if (!w.dig[i] || !w.mat[i]) continue;
        const p = x * TILE, q = y * TILE;
        ctx.strokeStyle = 'rgba(0,0,0,.45)';
        ctx.beginPath();
        ctx.moveTo(p + 3.6, q + 3.6); ctx.lineTo(p + TILE - 2.6, q + TILE - 2.6);
        ctx.moveTo(p + TILE - 2.6, q + 3.6); ctx.lineTo(p + 3.6, q + TILE - 2.6);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,196,80,.95)';
        ctx.beginPath();
        ctx.moveTo(p + 3, q + 3); ctx.lineTo(p + TILE - 3, q + TILE - 3);
        ctx.moveTo(p + TILE - 3, q + 3); ctx.lineTo(p + 3, q + TILE - 3);
        ctx.stroke();
      }
    }
  }

  // ------------------------------------------------------------- живность
  drawCritters(ctx, game) {
    for (const c of game.critters || []) {
      const px = c.px * TILE + TILE / 2, py = c.py * TILE + TILE - 3;
      ctx.save();
      ctx.translate(px, py);
      ctx.fillStyle = 'rgba(0,0,0,.32)';
      ctx.beginPath(); ctx.ellipse(0, 3, 5.5, 1.9, 0, 0, 7); ctx.fill();
      const body = ctx.createLinearGradient(0, -8, 0, 2);
      body.addColorStop(0, shadeHex(c.def.color, 1.25));
      body.addColorStop(1, shadeHex(c.def.color, 0.75));
      ctx.fillStyle = body;
      if (c.sp === 'hatch') {
        roundRect(ctx, -6, -6, 12, 8, 3.4); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 0.8; ctx.stroke();
        ctx.fillStyle = '#2c2119';
        ctx.fillRect(-4 * c.dir, -4, 1.4, 1.4);
        ctx.fillRect(-6, 1.5, 2, 2); ctx.fillRect(4, 1.5, 2, 2);
        ctx.fillStyle = 'rgba(255,255,255,.25)';
        ctx.fillRect(-4, -5.2, 7, 1.2);
      } else if (c.sp === 'puft') {
        const bob = Math.sin(this.t * 2 + c.id) * 1.2;
        ctx.beginPath(); ctx.arc(0, -4 + bob, 5, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.45)';
        ctx.beginPath(); ctx.arc(-1.7, -5.6 + bob, 1.5, 0, 7); ctx.fill();
        ctx.fillStyle = '#2b2233';
        ctx.beginPath(); ctx.arc(1.4, -4.4 + bob, 0.9, 0, 7); ctx.fill();
      } else {
        const swim = Math.sin(this.t * 6 + c.id) * 0.8;
        ctx.beginPath(); ctx.ellipse(0, -3 + swim, 5.5, 3, 0, 0, 7); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(5 * c.dir, -3 + swim); ctx.lineTo(8 * c.dir, -5.5 + swim); ctx.lineTo(8 * c.dir, -0.5 + swim);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#1d2b33';
        ctx.beginPath(); ctx.arc(-2 * c.dir, -3.6 + swim, 0.8, 0, 7); ctx.fill();
      }
      if (c.hunted) {
        ctx.strokeStyle = '#ff6b5e'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(0, -3, 8, 0, 7); ctx.stroke();
      }
      ctx.restore();
    }
  }

  // ------------------------------------------------------------ дупликанты
  drawPawns(ctx, game) {
    for (const p of game.pawns) {
      const px = p.px * TILE + TILE / 2, py = p.py * TILE + TILE;
      const moving = p.plan.length && p.plan[0].go;
      const walk = moving ? Math.sin(p.anim) : 0;
      const breathe = Math.sin(this.t * 2 + p.id) * 0.25;
      const asleep = p.task === 'sleep';
      ctx.save();
      ctx.translate(px, py);
      ctx.fillStyle = 'rgba(0,0,0,.32)';
      ctx.beginPath(); ctx.ellipse(0, 0, 6.2, 2.2, 0, 0, 7); ctx.fill();
      ctx.scale(p.facing, 1);

      ctx.strokeStyle = '#243c45'; ctx.lineWidth = 1.9; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-1.5, -5); ctx.lineTo(-1.5 + walk * 2.2, -0.4);
      ctx.moveTo(1.5, -5); ctx.lineTo(1.5 - walk * 2.2, -0.4);
      ctx.stroke();

      const body = ctx.createLinearGradient(-4.5, -12, 4.5, -4);
      body.addColorStop(0, shadeHSL(p.color, 1.18));
      body.addColorStop(1, shadeHSL(p.color, 0.78));
      ctx.fillStyle = body;
      roundRect(ctx, -4.5, -12 + breathe, 9, 8, 3.2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 0.8; ctx.stroke();

      ctx.strokeStyle = shadeHSL(p.color, 0.95); ctx.lineWidth = 1.9;
      ctx.beginPath();
      ctx.moveTo(-4, -10 + breathe); ctx.lineTo(-6 - walk, -6 + breathe);
      ctx.moveTo(4, -10 + breathe); ctx.lineTo(6 + walk, -6 + breathe);
      ctx.stroke();

      const head = ctx.createRadialGradient(-1.5, -18, 0.5, 0, -16.5, 6);
      head.addColorStop(0, '#f2fbfb');
      head.addColorStop(1, '#bcd8da');
      ctx.fillStyle = head;
      ctx.beginPath(); ctx.arc(0, -16.5 + breathe, 5.2, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.22)'; ctx.lineWidth = 0.8; ctx.stroke();

      const blink = (Math.sin(this.t * 1.3 + p.id * 2) > 0.985) ? 0.15 : 1;
      ctx.fillStyle = '#12262c';
      if (asleep || blink < 1) {
        ctx.fillRect(-3, -17 + breathe, 2.4, 0.9);
        ctx.fillRect(0.6, -17 + breathe, 2.4, 0.9);
      } else {
        ctx.beginPath();
        ctx.arc(-1.8, -17 + breathe, 1.15, 0, 7);
        ctx.arc(1.8, -17 + breathe, 1.15, 0, 7);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.75)';
        ctx.beginPath(); ctx.arc(-2.2, -17.4 + breathe, 0.4, 0, 7); ctx.fill();
      }
      ctx.strokeStyle = shadeHSL(p.color, 1.1); ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(-1, -21.2 + breathe); ctx.lineTo(1.5, -23.4 + breathe); ctx.stroke();
      ctx.restore();

      if (p.carry) this.chunk(ctx, p.carry.res, px + p.facing * 7, py - 9, 1.2);
      if (p.suitO2 > 0) {
        ctx.strokeStyle = 'rgba(150,220,255,.5)'; ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.arc(px, py - 16.5, 6.4, 0, 7); ctx.stroke();
      }

      const icons = [];
      if (p.oxygen < 45) icons.push('😵');
      if (p.calories < 1200) icons.push('🍗');
      if (p.stress > 80) icons.push('💢');
      if (p.sick) icons.push('🤒');
      if (asleep) icons.push('💤');
      if (icons.length) {
        ctx.font = '8px serif'; ctx.textAlign = 'center';
        ctx.fillText(icons.join(''), px, py - 26);
      }
      if (game.selected === p) {
        ctx.strokeStyle = '#ffb43d'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.ellipse(px, py, 9, 3.2, 0, 0, 7); ctx.stroke();
      }
      ctx.font = '5.5px "Trebuchet MS"'; ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(8,16,20,.75)';
      ctx.fillText(p.name.split(' ')[0], px + 0.4, py + 7.4);
      ctx.fillStyle = 'rgba(223,243,244,.92)';
      ctx.fillText(p.name.split(' ')[0], px, py + 7);
    }
  }

  // --------------------------------------------------------------- режимы
  drawOverlay(ctx, { x0, x1, y0, y1 }, game) {
    const w = this.world;
    ctx.fillStyle = 'rgba(4,10,14,.55)';
    ctx.fillRect(x0 * TILE, y0 * TILE, (x1 - x0 + 1) * TILE, (y1 - y0 + 1) * TILE);
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const i = y * W + x;
        const px = x * TILE, py = y * TILE;
        if (this.overlay === 'gas') {
          if (w.mat[i]) continue;
          if (w.water[i] > 20) {
            ctx.fillStyle = `rgba(40,110,190,${Math.min(0.9, 0.3 + w.water[i] / LIQ_FULL * 0.6)})`;
            ctx.fillRect(px, py, TILE, TILE); continue;
          }
          const gases = [[w.o2[i], '90,190,235'], [w.co2[i], '150,150,160'], [w.steam[i], '235,240,245'], [w.h2[i], '200,160,235']];
          gases.sort((a, b) => b[0] - a[0]);
          if (gases[0][0] < 0.01) continue;
          ctx.fillStyle = `rgba(${gases[0][1]},${Math.min(0.85, gases[0][0] / GAS_CAP)})`;
          ctx.fillRect(px, py, TILE, TILE);
        } else if (this.overlay === 'germs') {
          const gm = w.germs[i];
          if (gm < 1) continue;
          ctx.fillStyle = `rgba(150,220,80,${Math.min(0.75, gm / 300)})`;
          ctx.fillRect(px, py, TILE, TILE);
        } else if (this.overlay === 'light') {
          ctx.fillStyle = `rgba(255,230,140,${w.light[i] * 0.7})`;
          ctx.fillRect(px, py, TILE, TILE);
        } else if (this.overlay === 'temp') {
          const t = w.temp[i];
          const k = Math.max(0, Math.min(1, (t + 20) / 80));
          ctx.fillStyle = `rgba(${(k * 255) | 0},${(90 - k * 60) | 0},${((1 - k) * 235) | 0},.6)`;
          ctx.fillRect(px, py, TILE, TILE);
        }
      }
    }
    if (this.overlay === 'rooms') {
      let n = 0;
      for (const room of game.rooms) {
        const hue = (n++ * 67) % 360;
        ctx.fillStyle = `hsla(${hue},70%,55%,.35)`;
        for (const i of room.tiles) {
          const x = (i % W) * TILE, y = ((i / W) | 0) * TILE;
          ctx.fillRect(x, y, TILE, TILE);
        }
        const first = room.buildings[0];
        if (first) {
          ctx.fillStyle = '#fff'; ctx.font = '6px "Trebuchet MS"'; ctx.textAlign = 'center';
          ctx.fillText(room.name, first.x * TILE + TILE / 2, first.y * TILE - 3);
        }
      }
    }
    if (this.overlay === 'power') {
      for (const [, st] of w.bdata) {
        if (!st.built) continue;
        const x = st.x * TILE, y = st.y * TILE;
        const p = st.def.power || 0;
        if (!p && !st.def.storeJ) continue;
        ctx.fillStyle = p > 0 ? 'rgba(126,217,87,.6)' : st.powered ? 'rgba(255,180,61,.55)' : 'rgba(255,80,70,.6)';
        ctx.fillRect(x, y, TILE, TILE);
      }
    }
  }

  drawCursor(ctx, game) {
    const t = game.hover;
    if (!t || !this.world.inside(t.x, t.y)) return;
    const sel = game.drag;
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = 'rgba(255,255,255,.75)';
    if (sel) {
      const ax = Math.min(sel.x, t.x), ay = Math.min(sel.y, t.y);
      const bx = Math.max(sel.x, t.x), by = Math.max(sel.y, t.y);
      ctx.fillStyle = 'rgba(255,180,60,.18)';
      ctx.fillRect(ax * TILE, ay * TILE, (bx - ax + 1) * TILE, (by - ay + 1) * TILE);
      ctx.strokeRect(ax * TILE + .5, ay * TILE + .5, (bx - ax + 1) * TILE - 1, (by - ay + 1) * TILE - 1);
    } else {
      ctx.strokeRect(t.x * TILE + .5, t.y * TILE + .5, TILE - 1, TILE - 1);
    }
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/** Осветлить/затемнить hex-цвет. */
function shadeHex(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, ((n >> 16) & 255) * k);
  const g = Math.min(255, ((n >> 8) & 255) * k);
  const b = Math.min(255, (n & 255) * k);
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

/** То же для hsl(...) — цвета дупликантов задаются в HSL. */
function shadeHSL(hsl, k) {
  const m = /hsl\((\d+),\s*([\d.]+)%,\s*([\d.]+)%\)/.exec(hsl);
  if (!m) return hsl;
  const l = Math.max(8, Math.min(92, +m[3] * k));
  return `hsl(${m[1]},${m[2]}%,${l}%)`;
}

// ===== save.js =====================================================
// Сохранение и загрузка в localStorage. Большие массивы храним разрежённо.



const KEY = 'deepcolony.save';
const FLOATS = ['o2', 'co2', 'steam', 'h2', 'water', 'pwater', 'germs', 'temp', 'digProg'];
const BYTES = ['mat', 'back', 'dig', 'bid'];

const packSparse = (arr, round = 3) => {
  const out = [];
  const f = 10 ** round;
  for (let i = 0; i < arr.length; i++) if (arr[i]) out.push(i, Math.round(arr[i] * f) / f);
  return out;
};
const unpackSparse = (arr, into) => {
  into.fill(0);
  for (let i = 0; i < arr.length; i += 2) into[arr[i]] = arr[i + 1];
  return into;
};

function serialize(game) {
  const w = game.world;
  const data = {
    v: 1, seed: w.seed, time: game.time, cycle: game.cycle,
    world: { floats: {}, bytes: {}, cond: {} },
    items: [...w.items].map(([i, pile]) => [i, pile]),
    vents: w.vents,
    buildings: [...w.bdata.values()].map(st => ({
      x: st.x, y: st.y, layer: st.layer || 0, key: st.def.key, built: st.built, prog: st.prog,
      store: st.store, delivered: st.delivered, charge: st.charge, growth: st.growth,
      planted: st.planted, plant: st.plant, remove: st.remove, on: st.on,
      threshold: st.threshold, above: st.above,
    })),
    pawns: game.pawns.map(p => ({
      name: p.name, x: p.x, y: p.y, oxygen: p.oxygen, calories: p.calories, stamina: p.stamina,
      stress: p.stress, health: p.health, bladder: p.bladder, hygiene: p.hygiene, fun: p.fun,
      mood: p.mood, skills: p.skills, xp: p.xp, passions: p.passions, prio: p.prio,
      traits: p.traits.map(t => t.key), germs: p.germs, sick: p.sick, suitO2: p.suitO2,
      memories: p.memories, rel: [...p.rel], color: p.color, diet: p.diet,
    })),
    critters: game.critters.map(c => ({ sp: c.sp, x: c.x, y: c.y, hunger: c.hunger, age: c.age, hunted: c.hunted })),
    research: { done: [...game.research.done], current: game.research.current?.key || null, progress: game.research.progress },
    schedule: game.schedule.slots,
  };
  for (const f of FLOATS) data.world.floats[f] = packSparse(w[f]);
  for (const b of BYTES) data.world.bytes[b] = packSparse(w[b], 0);
  for (const k of Object.keys(w.cond)) data.world.cond[k] = packSparse(w.cond[k], 0);
  return data;
}

function applySave(game, data) {
  const w = game.world;
  for (const f of FLOATS) if (data.world.floats[f]) unpackSparse(data.world.floats[f], w[f]);
  for (const b of BYTES) if (data.world.bytes[b]) unpackSparse(data.world.bytes[b], w[b]);
  for (const k of Object.keys(w.cond)) if (data.world.cond[k]) unpackSparse(data.world.cond[k], w.cond[k]);

  w.items.clear();
  for (const [i, pile] of data.items) w.items.set(i, pile);
  w.vents = data.vents || [];

  w.bdata.clear();
  for (const b of data.buildings) {
    const def = B_BY_KEY[b.key];
    if (!def) continue;
    w.bdata.set(w.key(b.x, b.y, b.layer), {
      def, x: b.x, y: b.y, layer: b.layer, built: b.built, prog: b.prog,
      store: b.store || {}, delivered: b.delivered, charge: b.charge || 0, growth: b.growth || 0,
      planted: b.planted, plant: b.plant, remove: b.remove, on: b.on,
      threshold: b.threshold, above: b.above, powered: false, net: {},
    });
  }
  w.netDirty = true;

  game.pawns = data.pawns.map(d => {
    const p = new Pawn(w, d.x, d.y, Math.random);
    Object.assign(p, d, { rel: new Map(d.rel), traits: d.traits.map(k => TRAITS.find(t => t.key === k)).filter(Boolean) });
    p.px = d.x; p.py = d.y; p.plan = []; p.job = null; p.bed = null;
    // сбрасываем модификаторы, начисленные случайными чертами в конструкторе
    p.speed = 3.4; p.lungs = 1; p.appetite = 1; p.stressRate = 1; p.sleepNeed = 1; p.workMul = 1;
    for (const t of p.traits) t.mod(p);
    return p;
  });
  game.critters = (data.critters || []).map(d => Object.assign(new Critter(d.sp, d.x, d.y), d));
  game.research.done = new Set(data.research.done);
  game.research.progress = data.research.progress || 0;
  if (data.research.current) game.research.select(data.research.current);
  game.schedule.slots = data.schedule || game.schedule.slots;
  game.time = data.time; game.cycle = data.cycle;
  game.board.jobs = []; game.board.claimed.clear(); game.board.bad.clear();
  return game;
}

function saveGame(game) {
  try {
    localStorage.setItem(KEY, JSON.stringify(serialize(game)));
    game.alert('Игра сохранена.', true);
    return true;
  } catch (e) {
    game.alert('Не удалось сохранить: ' + e.message);
    return false;
  }
}

function hasSave() {
  try { return !!localStorage.getItem(KEY); } catch { return false; }
}

function loadInto(game) {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return false;
    applySave(game, JSON.parse(raw));
    game.alert('Игра загружена.', true);
    return true;
  } catch (e) {
    game.alert('Не удалось загрузить: ' + e.message);
    return false;
  }
}

function savedSeed() {
  try { return JSON.parse(localStorage.getItem(KEY)).seed; } catch { return null; }
}

// ===== ui.js =======================================================
// Интерфейс: панели, инструменты, ввод мыши и клавиатуры.







const TABS = [
  { name: 'Приказы', tools: [
    { key: 'select', icon: '🔍', name: 'Осмотр' },
    { key: 'dig',    icon: '⛏', name: 'Копать' },
    { key: 'hunt',   icon: '🏹', name: 'Отлов' },
    { key: 'cancel', icon: '✖',  name: 'Отмена' },
    { key: 'decon',  icon: '🔨', name: 'Разобрать' },
  ]},
  ...Object.entries(CAT).map(([cat, name]) => ({
    name, tools: BUILDINGS.filter(b => b && b.cat === cat).map(b => b.key),
  })),
];

class UI {
  constructor(game, renderer) {
    this.game = game; this.r = renderer;
    this.tab = 0; this.tool = { key: 'select' };
    this.buildTabs(); this.buildTools();
    this.bindInput();
    this.lastUI = 0;
    this.cache = {};       // последняя разметка панелей — без неё они мигали каждый кадр
  }

  // --------------------------------------------------------------- панели
  buildTabs() {
    const host = document.getElementById('tabs');
    host.innerHTML = '';
    TABS.forEach((t, i) => {
      const el = document.createElement('div');
      el.className = 'tab' + (i === this.tab ? ' active' : '');
      el.textContent = t.name;
      el.onclick = () => { this.tab = i; this.buildTabs(); this.buildTools(); };
      host.appendChild(el);
    });
  }

  buildTools() {
    const host = document.getElementById('tools');
    host.innerHTML = '';
    for (const t of TABS[this.tab].tools) {
      const def = typeof t === 'string' ? B_BY_KEY[t] : null;
      const key = def ? def.key : t.key;
      const locked = def && !this.game.research.unlocked(def);
      const el = document.createElement('div');
      el.className = 'tool' + (this.tool.key === key ? ' active' : '') + (locked ? ' locked' : '');
      el.title = def ? `${def.name}${locked ? ' — нужно исследование' : ''}` : t.name;
      el.innerHTML = def
        ? `<div class="ic">${locked ? '🔒' : def.icon}</div><div class="nm">${def.name}</div>
           <div class="cost">${Object.entries(def.cost).map(([r, a]) => `${a}${RESOURCES[r].icon}`).join(' ')}</div>`
        : `<div class="ic">${t.icon}</div><div class="nm">${t.name}</div><div class="cost">&nbsp;</div>`;
      el.onclick = () => {
        if (locked) return;
        this.tool = def ? { key: def.key, build: def } : { key: t.key };
        this.buildTools();
      };
      host.appendChild(el);
    }
    document.getElementById('hint').textContent = this.tool.build
      ? `${this.tool.build.name}: ЛКМ — поставить чертёж (можно протянуть). Материалы принесут дупликанты.`
      : 'ЛКМ — применить · ПКМ/Esc — отмена инструмента · СКМ — камера · колесо — зум · Space — пауза';
  }

  // ----------------------------------------------------------------- ввод
  bindInput() {
    const c = this.r.c, g = this.game;
    let panning = false, last = null;

    c.addEventListener('contextmenu', e => e.preventDefault());

    c.addEventListener('pointerdown', e => {
      c.setPointerCapture?.(e.pointerId);
      const t = this.r.screenToTile(e.clientX, e.clientY);
      if (e.button === 1 || e.shiftKey) { panning = true; last = { x: e.clientX, y: e.clientY }; return; }
      if (e.button === 2) { this.tool = { key: 'select' }; this.buildTools(); g.drag = null; return; }
      if (this.tool.key === 'select') { this.selectAt(t); return; }
      g.drag = t;
    });

    window.addEventListener('pointermove', e => {
      const t = this.r.screenToTile(e.clientX, e.clientY);
      g.hover = t;
      if (panning && last) {
        this.r.cam.x -= (e.clientX - last.x) / this.r.cam.z;
        this.r.cam.y -= (e.clientY - last.y) / this.r.cam.z;
        last = { x: e.clientX, y: e.clientY };
      }
    });

    window.addEventListener('pointerup', e => {
      panning = false;
      if (!g.drag) return;
      const t = this.r.screenToTile(e.clientX, e.clientY);
      this.applyArea(g.drag, t);
      g.drag = null;
    });

    let pinch = null;
    c.addEventListener('touchstart', e => {
      if (e.touches.length !== 2) return;
      panning = false; g.drag = null;
      pinch = this.touchInfo(e);
    }, { passive: true });
    c.addEventListener('touchmove', e => {
      if (e.touches.length !== 2 || !pinch) return;
      e.preventDefault();
      const now = this.touchInfo(e);
      this.r.cam.z = Math.max(0.6, Math.min(4.5, this.r.cam.z * (now.d / pinch.d)));
      this.r.cam.x -= (now.x - pinch.x) / this.r.cam.z;
      this.r.cam.y -= (now.y - pinch.y) / this.r.cam.z;
      pinch = now;
    }, { passive: false });
    c.addEventListener('touchend', () => { pinch = null; }, { passive: true });

    c.addEventListener('wheel', e => {
      e.preventDefault();
      const k = e.deltaY < 0 ? 1.15 : 1 / 1.15;
      this.r.cam.z = Math.max(0.6, Math.min(4.5, this.r.cam.z * k));
    }, { passive: false });

    window.addEventListener('keydown', e => {
      if (e.code === 'Space') { e.preventDefault(); g.speed = g.speed ? 0 : 1; this.syncSpeed(); }
      if (e.code === 'Escape') { this.tool = { key: 'select' }; this.buildTools(); g.drag = null; }
      if (e.key === '1') { g.speed = 1; this.syncSpeed(); }
      if (e.key === '2') { g.speed = 2; this.syncSpeed(); }
      if (e.key === '3') { g.speed = 3; this.syncSpeed(); }
      const pan = 40 / this.r.cam.z;
      if (e.key === 'ArrowLeft' || e.key === 'a') this.r.cam.x -= pan;
      if (e.key === 'ArrowRight' || e.key === 'd') this.r.cam.x += pan;
      if (e.key === 'ArrowUp' || e.key === 'w') this.r.cam.y -= pan;
      if (e.key === 'ArrowDown' || e.key === 's') this.r.cam.y += pan;
    });

    document.querySelectorAll('.spd[data-speed]').forEach(b => {
      b.onclick = () => { g.speed = +b.dataset.speed; this.syncSpeed(); };
    });
    document.getElementById('btn-save').onclick = () => saveGame(g);
    document.getElementById('btn-load').onclick = () => { if (hasSave()) loadInto(g); else g.alert('Сохранений нет.'); };
    document.querySelectorAll('.ov').forEach(b => {
      b.onclick = () => {
        document.querySelectorAll('.ov').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        this.r.overlay = b.dataset.ov;
      };
    });
  }

  /** Центр и разброс двух касаний — для панорамы и зума. */
  touchInfo(e) {
    const [a, b] = [e.touches[0], e.touches[1]];
    return {
      x: (a.clientX + b.clientX) / 2,
      y: (a.clientY + b.clientY) / 2,
      d: Math.max(1, Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY)),
    };
  }

  syncSpeed() {
    document.querySelectorAll('.spd[data-speed]').forEach(b =>
      b.classList.toggle('active', +b.dataset.speed === this.game.speed));
  }

  /** Оповещения живут собственными узлами: новые появляются, старые исчезают,
   *  остальные не трогаем — иначе анимация перезапускается и надпись дёргается. */
  syncAlerts(g) {
    const host = document.getElementById('alerts');
    const live = g.alerts.filter(a => g.time - a.t < 12);
    const seen = new Set();
    for (const a of live) {
      const key = `${a.t.toFixed(2)}|${a.text}`;
      seen.add(key);
      if (host.querySelector(`[data-key="${CSS.escape(key)}"]`)) continue;
      const el = document.createElement('div');
      el.className = 'alert' + (a.info ? ' info' : '');
      el.dataset.key = key;
      el.textContent = a.text;
      host.appendChild(el);
    }
    for (const el of [...host.children]) {
      if (seen.has(el.dataset.key) || el.dataset.fading) continue;
      el.dataset.fading = '1';
      el.classList.add('fade');
      setTimeout(() => el.remove(), 400);
    }
  }

  selectAt(t) {
    const g = this.game;
    let best = null, bd = 2.2;
    for (const p of g.pawns) {
      const d = Math.hypot(p.px - t.x, p.py - t.y);
      if (d < bd) { bd = d; best = p; }
    }
    g.selected = best;
  }

  applyArea(a, b) {
    const g = this.game;
    const x0 = Math.min(a.x, b.x), x1 = Math.max(a.x, b.x);
    const y0 = Math.min(a.y, b.y), y1 = Math.max(a.y, b.y);
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        switch (this.tool.key) {
          case 'dig': g.orderDig(x, y); break;
          case 'cancel': g.cancel(x, y); break;
          case 'decon': g.orderDeconstruct(x, y); break;
          case 'hunt': g.orderHunt(x, y); break;
          default: if (this.tool.build) g.place(x, y, this.tool.build.key);
        }
      }
    }
  }

  // --------------------------------------------------------------- вывод
  /** Обновить панель, только если её содержимое изменилось. */
  setHTML(id, html) {
    if (this.cache[id] === html) return false;
    this.cache[id] = html;
    document.getElementById(id).innerHTML = html;
    return true;
  }

  setText(id, text) {
    if (this.cache['t:' + id] === text) return;
    this.cache['t:' + id] = text;
    document.getElementById(id).textContent = text;
  }

  update(dt) {
    this.lastUI += dt;
    if (this.lastUI < 0.2) return;
    this.lastUI = 0;
    const g = this.game, w = g.world;

    this.setText('cycle', `Цикл ${g.cycle} · ${g.cycleT > 0.75 ? 'ночь' : 'день'} · ${g.pawns.length} дупл.`);

    const res = ['food', 'stone', 'copper', 'dirt', 'coal', 'algae', 'ice'];
    this.setHTML('resbar',
      res.map(r => `<div class="r"><i>${RESOURCES[r].icon}</i>${RESOURCES[r].name} <b>${Math.round(g.stock(r))}</b></div>`).join('') +
      `<div class="r"><i>⚡</i><b>${Math.round(g.power.gen)}</b>/${Math.round(g.power.demand)} Вт · ${(g.power.stored / 1000).toFixed(1)} кДж</div>`);

    // инспектор
    const t = g.hover;
    const body = document.getElementById('inspector-body');
    if (t && w.inside(t.x, t.y)) {
      const i = w.idx(t.x, t.y);
      const m = MATS[w.mat[i]];
      const st = w.bstate(t.x, t.y) || w.allAt(t.x, t.y)[0];
      const pile = w.items.get(i);
      const rows = [];
      rows.push(kv('Тайл', `${t.x}, ${t.y}`));
      rows.push(kv('Порода', m ? m.name : '—'));
      rows.push(kv('Кислород', mass(w.o2[i])));
      rows.push(kv('CO₂', mass(w.co2[i])));
      rows.push(kv('Пар', mass(w.steam[i])));
      rows.push(kv('Водород', mass(w.h2[i])));
      rows.push(kv('Вода', `${w.water[i].toFixed(1)} кг${w.pwater[i] > 0.4 ? ' (грязная)' : ''}`));
      rows.push(kv('Температура', `${w.temp[i].toFixed(1)} °C`));
      rows.push(kv('Свет', `${Math.round(w.light[i] * 100)} %`));
      if (w.germs[i] > 1) rows.push(kv('Микробы', Math.round(w.germs[i])));
      if (w.dig[i]) rows.push(kv('Приказ', 'копать'));
      if (st) {
        rows.push('<div class="sep"></div>');
        rows.push(kv('Постройка', st.def.name));
        rows.push(kv('Статус', st.built ? (st.remove ? 'на разбор' : 'работает') : `стройка ${Math.round(st.prog / st.def.work * 100)}%`));
        if (!st.built) rows.push(kv('Доставлено', Object.entries(st.delivered || {}).map(([r, a]) => `${Math.round(a)} ${RESOURCES[r].name}`).join(', ') || '—'));
        if (st.def.sensor) {
          rows.push(kv('Датчик', st.def.sensor === 'manual' ? (st.on !== false ? 'включён' : 'выключен')
            : `${st.above ?? st.def.above ? '>' : '<'} ${st.threshold ?? st.def.threshold}`));
          rows.push(kv('Сигнал', st.signal ? 'ДА' : 'нет'));
        }
        if (st.autoOff) rows.push(kv('Автоматика', 'выключено сигналом'));
        if (st.def.power) rows.push(kv('Энергия', `${st.def.power} Вт ${st.def.power < 0 ? (st.powered ? '✅' : '❌') : ''}`));
        if (st.def.storeJ) rows.push(kv('Заряд', `${(st.charge / 1000).toFixed(1)} кДж`));
        if (Object.keys(st.store || {}).length)
          rows.push(kv('Внутри', Object.entries(st.store).map(([r, a]) => `${Math.round(a)} ${RESOURCES[r].name}`).join(', ')));
        if (st.def.farm) {
          rows.push(kv('Культура', st.plant ? `${PLANTS[st.plant].icon} ${PLANTS[st.plant].name}` : '—'));
          rows.push(kv('Рост', st.planted ? `${Math.round(st.growth * 100)}%${st.wilt ? ` (${st.wilt})` : ''}` : 'нужен субстрат'));
          if (st.plant) rows.push(kv('Требования', PLANTS[st.plant].hint));
        }
        for (const kind of ['power', 'liquid', 'gas']) {
          const id = st.net?.[kind] ?? -1;
          if (id < 0) continue;
          const net = g.nets.net(kind, id);
          const label = kind === 'power' ? 'Электросеть' : kind === 'liquid' ? 'Водопровод' : 'Газопровод';
          rows.push(kv(label, kind === 'power'
            ? `${Math.round(net.gen)}/${Math.round(net.demand)} Вт`
            : Object.entries(net.buffer).map(([r, a]) => `${r} ${a.toFixed(1)}`).join(', ') || 'пусто'));
        }
      }
      const cr = (g.critters || []).find(c => c.x === t.x && c.y === t.y);
      if (cr) {
        rows.push('<div class="sep"></div>');
        rows.push(kv('Существо', cr.def.name));
        rows.push(kv('Сытость', `${Math.round(cr.hunger / cr.def.hungerMax * 100)}%`));
        if (cr.hunted) rows.push(kv('Метка', 'на отлов'));
      }
      if (pile) {
        rows.push('<div class="sep"></div>');
        rows.push(kv('На полу', Object.entries(pile).map(([r, a]) => `${Math.round(a)} ${RESOURCES[r].name}`).join(', ')));
      }
      this.setHTML('inspector-body', rows.join(''));
    }

    // расписание
    const strip = document.getElementById('schedule-strip');
    const nowSlot = Math.min(11, Math.floor(g.cycleT * 12));
    const stripHTML = g.schedule.slots.map((k, idx) =>
      `<div class="${idx === nowSlot ? 'now' : ''}" data-slot="${idx}" title="${BLOCKS[k].name}"
        style="background:${BLOCKS[k].color}33;border-color:${BLOCKS[k].color}">${BLOCKS[k].icon}</div>`).join('');
    if (this.setHTML('schedule-strip', stripHTML)) {
      strip.querySelectorAll('div').forEach(el => {
        el.onclick = () => { g.schedule.cycle(+el.dataset.slot); this.lastUI = 1; };
      });
    }

    // исследования
    const rb = document.getElementById('research-body');
    const R = g.research;
    const techHTML = TECHS.map(t => {
      const done = R.done.has(t.key);
      const ready = t.req.every(r => R.done.has(r));
      const cur = R.current?.key === t.key;
      const pct = cur ? Math.round(R.progress / t.cost * 100) : 0;
      return `<div class="tech ${done ? 'done' : ''} ${cur ? 'active' : ''}" data-tech="${t.key}">
        <div><b>${t.name}</b> ${done ? '✔' : ready ? `${t.cost}` : '🔒'}</div>
        <div class="d">${t.desc}</div>
        ${cur ? `<div class="bar"><i style="width:${pct}%;background:var(--accent2)"></i></div>` : ''}
      </div>`;
    }).join('');
    if (this.setHTML('research-body', techHTML)) {
      rb.querySelectorAll('.tech').forEach(el => {
        el.onclick = () => { R.select(el.dataset.tech); this.lastUI = 1; };
      });
    }

    // колонисты
    const list = document.getElementById('colonist-list');
    const listHTML = g.pawns.map(p => {
      const sel = g.selected === p;
      const detail = sel ? `
        <div class="sep"></div>
        <div class="blabel"><span>Черты</span></div>
        <div>${p.traits.map(t => `<b title="${t.desc}">${t.name}</b>`).join(', ')}</div>
        <div class="blabel"><span>Навыки</span></div>
        <div>⛏ ${p.skills.dig.toFixed(1)} · 🔨 ${p.skills.build.toFixed(1)} · 🌱 ${p.skills.farm.toFixed(1)} · 📦 ${p.skills.haul.toFixed(1)}</div>
        <div class="blabel"><span>Настроение</span><span>${Math.round(p.mood)}</span></div>
        <div>${p.moodFactors.map(f => `<span style="color:${f[1] < 0 ? 'var(--bad)' : 'var(--good)'}">${f[0]} ${f[1] > 0 ? '+' : ''}${f[1]}</span>`).join(' · ')}</div>
        ${p.sick ? `<div style="color:var(--bad)">Болезнь: ${p.sick.name}</div>` : ''}
        <div class="blabel"><span>Работы (клик — вкл/выкл)</span></div>
        <div class="prio">${JOB_ORDER.map(j => {
          const v = p.prioOf(j);
          return `<span class="${v === 0 ? 'off' : v >= 5 ? 'p5' : v <= 1 ? 'p1' : ''}" data-pid="${p.id}" data-job="${j}">${JOB_LABEL[j] || j} ${v}</span>`;
        }).join('')}</div>
        <div class="blabel"><span>Увлечения</span></div>
        <div>${Object.entries(p.passions).filter(([, v]) => v).map(([k, v]) => `${v === 2 ? '🔥' : '✨'} ${k}`).join(' · ') || '—'}</div>
        <div class="blabel"><span>Отношения</span></div>
        <div class="rel">${g.pawns.filter(q => q !== p).map(q => `${q.name.split(' ')[0]}: ${p.relationTo(q)} (${Math.round(p.opinion(q))})`).join('<br>') || '—'}</div>
        ${p.suitO2 > 0 ? `<div>Скафандр: ${Math.round(p.suitO2)}%</div>` : ''}
      ` : '';
      return `<div class="col-card ${sel ? 'sel' : ''}" data-id="${p.id}">
        <div class="col-head"><span class="col-name">${p.name}</span><span class="col-task">${p.statusText()}</span></div>
        ${bar('O₂', p.oxygen, 100, '#68c8e8')}
        ${bar('Еда', p.calories, 4000, '#e8b95c')}
        ${bar('Силы', p.stamina, 100, '#8ad86a')}
        ${bar('Стресс', p.stress, 100, '#e8705c')}
        ${bar('Здоровье', p.health, 100, '#e86a9a')}
        ${sel ? bar('Мочевой пузырь', p.bladder, 100, '#c8b45c') + bar('Гигиена', p.hygiene, 100, '#7ec8c8') + bar('Досуг', p.fun, 100, '#c58ae0') : ''}
        ${detail}
      </div>`;
    }).join('') || '<div>Колонистов нет.</div>';
    if (this.setHTML('colonist-list', listHTML)) {
    list.querySelectorAll('.prio span').forEach(el => {
      el.onclick = (e) => {
        e.stopPropagation();
        const p = g.pawns.find(x => x.id === +el.dataset.pid);
        if (!p) return;
        const cur = p.prioOf(el.dataset.job);
        p.prio[el.dataset.job] = e.shiftKey ? Math.max(0, cur - 1) : (cur + 1) % 6;
        p.dropJob(g);
        this.lastUI = 1;
      };
    });
    list.querySelectorAll('.col-card').forEach(el => {
      el.onclick = () => { g.selected = g.pawns.find(p => p.id === +el.dataset.id); this.lastUI = 1; };
    });
    }

    // оповещения
    this.syncAlerts(g);
  }
}

const kv = (k, v) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`;
const bar = (label, v, max, color) => {
  const pct = Math.max(0, Math.min(100, v / max * 100));
  return `<div class="blabel"><span>${label}</span><span>${Math.round(pct)}%</span></div>
          <div class="bar"><i style="width:${pct}%;background:${color}"></i></div>`;
};

// ===== main.js =====================================================
// Точка входа: создание мира и главный цикл.



const seed = Number(new URLSearchParams(location.search).get('seed')) || (Date.now() & 0xffff);
const game = new Game(seed);
const renderer = new Renderer(document.getElementById('view'), game.world);
const ui = new UI(game, renderer);

window.game = game;          // для отладки из консоли
window.renderer = renderer;
window.ui = ui;

let prev = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - prev) / 1000);
  prev = now;
  game.update(dt);
  renderer.draw(game);
  ui.update(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
